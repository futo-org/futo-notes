<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>FUTO Notes Editor</title>
  <!-- Legacy Android System WebView runtime shim (github#8). The editor bundle
       targets ES2020 (syntax floor: Chromium 80), but Svelte 5's client runtime
       calls String.prototype.replaceAll (Chromium 85), so without this the whole
       app throws on Chromium 80-84 and the editor never mounts. A classic (non-
       module) script runs before the deferred module bundle. Engines below the
       ES2020 syntax floor are caught natively (see Android EditorWebView). -->
  <script>
    if (!String.prototype.replaceAll) {
      String.prototype.replaceAll = function (search, replacement) {
        if (Object.prototype.toString.call(search) === '[object RegExp]') {
          if (!search.global) {
            throw new TypeError('replaceAll must be called with a global RegExp');
          }
          return String.prototype.replace.call(this, search, replacement);
        }
        var escaped = String(search).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return String.prototype.replace.call(this, new RegExp(escaped, 'g'), replacement);
      };
    }
  </script>
  <!-- Engine capability preflight (github#8). The bundle is built with vite
       `target: 'ES2020'`, so an engine that can't parse it throws on the module
       script below and the editor never mounts — a blank pane. This classic ES5
       script parses on ANY engine, compiles the syntax the bundle needs, and
       leaves the verdict here for the native host to read (Android:
       EditorEngineSupport.kt's ENGINE_PROBE_JS). Capability, never a version
       number — apps/android/AGENTS.md records the vendor-WebView regression that
       taught us the difference. Deliberately not a futoBridge message: the
       contract in packages/editor/src/bridge.ts belongs to the bundle that just
       failed to parse, and adding a message would bump BRIDGE_VERSION and oblige
       both native hosts (M10) for a verdict only Android reads. -->
  <script>
    window.__futoEngineUnsupported = (function () {
      try {
        // Parse-only: constructing a Function compiles the body, never runs it.
        // Optional chaining and nullish coalescing both landed in Chromium 80,
        // so one probe covers the floor.
        new Function('var o = {}; return o?.a ?? 1;');
        return null;
      } catch (e) {
        return 'ES2020 syntax (optional chaining / nullish coalescing)';
      }
    })();
  </script>
  <style>
    /* ------------------------------------------------------------------ *
     * Embedded editor layout for the native-iOS WKWebView host.
     *
     * Goals (all observed on a real iPhone):
     *  1. Comfortable horizontal margins (+ safe-area insets for notch /
     *     landscape).
     *  2. SCROLLING that actually works. We use CodeMirror 6's NATIVE
     *     fixed-height mode: give .cm-editor a definite (viewport) height and
     *     let its .cm-scroller scroll internally. (The earlier "let the page
     *     scroll" approach with height:auto + overflow:visible did NOT scroll
     *     — CM is built to scroll inside .cm-scroller when the editor has a
     *     fixed height.)
     *  3. An empty note must still be tappable: the scroller fills the editor
     *     and iOS resolves taps from its non-editable blank tail.
     *
     * NOTE ON SPECIFICITY: MarkdownEditor.svelte installs an inline
     * EditorView.theme with `&{height:auto}` and `.cm-content{padding:0}`.
     * That CSS is unlayered and injected by CodeMirror. The rules below are
     * also unlayered (plain <style>); we use !important to beat CM's theme.
     * ------------------------------------------------------------------ */

    :root {
      --futo-edit-pad-x: 18px;
      /* Trailing space so the last lines can scroll clear of the keyboard. */
      --futo-edit-pad-bottom: max(40vh, 280px);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;          /* the page never scrolls; .cm-scroller does */
      overscroll-behavior: none;
      /* Both native hosts render this page in a TRANSPARENT web view
       * (iOS: isOpaque=false + .clear, Android: setBackgroundColor(TRANSPARENT))
       * and paint the app background behind it (iOS Theme.background, Android
       * Compose surface). app.css's @layer base would otherwise paint the web
       * palette's --color-bg over it — dark #0A0A0A vs the hosts' dark
       * surfaces — so the editor pane visibly mismatches the surrounding
       * native UI in dark mode. Unlayered, so it beats the layered rule. */
      background: transparent;
    }

    /* Pin the body to the web view, unlayered (github#33).
     *
     * This is a deliberate copy of src/styles/base.css's `body { position:
     * fixed; inset: 0 }` — the rule that gives #editor below a containing block
     * with a REAL height. base.css lives in `@layer base`, and `@layer` is
     * Chromium 99, so every WebView in the 80–98 band drops it. Without it the
     * body is static and zero-height, and #editor's offsets fall back to the
     * initial containing block, which this engine sizes to ZERO (the same defect
     * that makes it resolve 100vh/100dvh to 0 — measured on an Android 11 /
     * Chromium 83 WebView: `position: absolute; top: 0; bottom: 0` gives 0px
     * there, while an explicit pixel height or a fixed-position box gives the
     * correct 555px). The whole height chain below then collapses, .cm-scroller
     * never becomes a scroll container, and CodeMirror scrolls the ROOT document
     * to reveal the cursor instead — which slides the note up under the shell's
     * native title bar as you type (github#33, reported on 1.7.0 / Android 10).
     *
     * Identical declarations to base.css's, so engines that DO apply that layer
     * see no change; longhands rather than `inset` because that shorthand is
     * Chromium 87 (see #editor below). Keep the two in step. */
    body {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    /* Legacy-WebView text-color fallback (github#8). Non-updated Android 8-10
     * system WebViews predate @layer (Chromium 99) and drop EVERY rule inside
     * Tailwind's layers — including the @theme light tokens and the
     * body/.cm-editor color rules — leaving UA-black text over the hosts'
     * surface (invisible in dark mode). The [data-theme='dark'] variable
     * overrides in theme.css stay unlayered, so var() still resolves there;
     * the literal fallback covers light mode, where the @layer'd token is
     * lost. Inherited from html, so it never outranks the layered rules that
     * modern engines apply on body/.cm-editor. The hex must equal theme.css's
     * light --color-text (locked by the legacy-WebView tests in
     * tests/editor-embed-bridge.spec.ts). */
    html {
      color: var(--color-text, #0f0f0f);
    }

    /* Fill the web view — a DEFINITE height for the chain below.
     *
     * LONGHANDS, never `inset: 0` (github#33). The `inset` shorthand is
     * Chromium 87; the editor's engine floor is 80, so a WebView in the 80–86
     * band drops that one declaration and leaves `position: absolute` with all
     * four offsets `auto`. #editor then shrink-wraps its text at the static
     * position instead of filling the pane: `.cm-editor`'s `height: 100%`
     * resolves against an auto-height parent, `.cm-scroller` never becomes a
     * scroll container, and the note grows past the bottom of the pane with
     * nothing to scroll — so CodeMirror's scroll-cursor-into-view moves the
     * ROOT document and the note slides up under the shell's native title bar.
     * Reported on 1.7.0 / Android 10. Locked by the "pre-inset WebView" tests
     * in tests/editor-embed-bridge.spec.ts. The same goes for any other
     * post-80 CSS added to THIS stylesheet: everything the app's own
     * @layer'd CSS declares is already discarded by these engines
     * (@layer is Chromium 99), so this rule is the whole layout on them. */
    #editor {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
    }

    /* MarkdownEditor.svelte mounts a single wrapper <div> inside #editor;
     * carry #editor's definite height down through it so .cm-editor can
     * resolve a percentage height. */
    #editor > :first-child {
      height: 100% !important;
    }

    /* Fixed height enables CM's internal scroller. We anchor to a definite
     * height CHAIN (#editor is absolutely positioned to all four edges) rather
     * than viewport units:
     * Android System WebView resolves 100dvh/100vh to 0 here (while
     * innerHeight/clientHeight are correct), collapsing the editor to 0px and
     * painting blank. 100% off the definite chain works on both WKWebView and
     * Android WebView. */
    .cm-editor {
      height: 100% !important;
    }

    /* CM's own scroller is the scroll container (vertical), with momentum.
     * overscroll-behavior:contain keeps the native rubber-band BOUNCE at the
     * top/bottom (iOS users expect it; its absence reads as "stuck") while still
     * preventing scroll from chaining out to the host web view. (We previously
     * used `none` to suppress bounce for a scroll-jump guard that wrote scrollTop
     * mid-scroll; that guard is gone — the height map is warmed up front instead,
     * see $lib/heightMapWarm.ts — so bounce is back.) */
    .cm-scroller {
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      overscroll-behavior: contain !important;
    }

    /* Text gutters and the default keyboard tail. iOS moves the tail to the
     * scroller below so WebKit cannot apply a second editable selection. */
    .cm-content {
      padding-left: calc(var(--futo-edit-pad-x) + env(safe-area-inset-left)) !important;
      padding-right: calc(var(--futo-edit-pad-x) + env(safe-area-inset-right)) !important;
      padding-top: 14px !important;
      padding-bottom: var(--futo-edit-pad-bottom) !important;
      box-sizing: border-box !important;
      /* Fill the scroller so an EMPTY note is fully tappable. The definite
       * height chain above (#editor → wrapper → .cm-editor → .cm-scroller)
       * gives the scroller a resolvable height, so 100% no longer collapses —
       * and unlike 100dvh it isn't zeroed by Android WebView. */
      min-height: 100% !important;
    }

    .cm-editor[data-ios-off-text-surface] .cm-scroller {
      position: relative !important;
      padding-bottom: 0 !important;
    }

    .cm-editor[data-ios-off-text-surface] .cm-scroller::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 1px;
      height: var(--futo-edit-pad-bottom);
      pointer-events: none;
    }

    .cm-editor[data-ios-off-text-surface] .cm-content {
      min-height: 0 !important;
      padding-bottom: 0 !important;
      margin-bottom: var(--futo-edit-pad-bottom) !important;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module" src="/src/editor-embed/main.ts"></script>
</body>
</html>
