[package]
name = "futo-notes-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "futo_notes_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "futo-notes-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2.7", default-features = false }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
futo-notes-core = { path = "../../../crates/futo-notes-core" }
# Shared E2EE sync session + state + SSE live loop. The desktop sync
# commands are thin wrappers that delegate to this crate (same source of
# truth as the native iOS/Android shells via futo-notes-ffi).
futo-notes-sync = { path = "../../../crates/futo-notes-sync" }
# The durable local-note owner, including the derived BM25 index.
futo-notes-store = { path = "../../../crates/futo-notes-store" }
time = { version = "0.3", features = ["formatting"] }
notify = "8.2.0"
png = "0.18"
libc = "0.2"
# The vault key is 32 raw bytes; the OS keyring stores strings, so it travels
# as hex. Already a workspace dependency (futo-notes-core).
hex = "0.4"
# The random part of an image's name. Already a workspace dependency (futo-notes-core).
rand = "0.8"
# What this computer calls itself, for the pairing confirmation sheet on the
# device that scans this one's QR code. Already in the tree (x11rb pulls it on
# Linux); a direct edge just makes it available on every desktop OS.
gethostname = "1.1"
tauri-plugin-mcp-bridge = "0.13"
# =2.6.1: 2.6.2 does not compile on Linux — it builds `ini::ParseOption` with a struct
# literal that misses two fields rust-ini 0.21.3 has (E0063). Lift when a fixed 2.6.x ships.
tauri-plugin-deep-link = "=2.6.1"
futo-notes-license = { version = "0.1.0", path = "../../../crates/futo-notes-license" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# OS secret store for the E2EE vault password (F6) lives in the per-OS target
# tables below. Desktop-only, and deliberately NOT in the portable crates —
# the note domain must stay free of platform secret-store deps (CI
# test:rust:dep-guard). Each OS pulls only its own native backend so no
# D-Bus/Secret-Service code compiles on macOS/Windows.

# Route folder/note deletes through the desktop system trash so users can
# recover from accidental deletes.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
trash = "5"
# In-app self-updater (the native mobile apps update through their stores).
# Checks a signed JSON manifest, verifies the minisign signature against the
# pubkey in tauri.conf.json, downloads the matching bundle for this OS/arch,
# swaps it, and relaunches via plugin-process.
tauri-plugin-updater = "2"
# Restore the window's size, position and maximized state across launches.
# A window that reopens at the config default every time is browser behavior;
# the plugin also validates the restored rect against the attached monitors, so
# unplugging a display cannot strand the window off-screen. Its state file is
# keyed by the bundle identifier, so dev/release/worktree builds never share one.
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# tao's delegate has no applicationShouldTerminate:; macos_terminate.rs adds one.
# Real mouse events for `just puppet click`/`drag`/`scroll` (puppet_input.rs): built with
# AppKit and sent to this window only. Same objc2 generation wry already pulls in;
# AppKit has no wheel-event constructor, so a scroll starts as a CoreGraphics event.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGDirectDisplay", "CGEvent", "CGEventTypes"] }
# NSProcessInfo + NSString also opt debug builds out of App Nap (platform_integration.rs).
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Real input for `just puppet` (puppet_input.rs, puppet_keys.rs): DevTools input calls on this
# window's WebView2. The webview2-com/windows generation wry already pulls in.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2.7", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "2"
glib = "0.18"
# The web-process-terminated signal (close_deadline.rs); the version tauri/wry already use.
webkit2gtk = "2"
# Real input and screenshots for `just puppet` (puppet_input.rs, puppet_keys.rs,
# puppet_screenshot.rs): GDK events (gtk::gdk) and a WebKitGTK snapshot encoded as PNG,
# the gtk-rs generation webkit2gtk already pulls in.
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
zbus = "5"

[lints]
workspace = true

[dev-dependencies]
specta = { version = "=2.0.0-rc.23", features = ["derive"] }
specta-typescript = "=0.0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
