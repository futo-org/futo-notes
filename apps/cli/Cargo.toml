[package]
name = "futo-notes-cli"
version = "0.1.0"
edition = "2021"
description = "FUTO Notes command-line client"

[[bin]]
name = "futo-notes"
path = "src/main.rs"

[dependencies]
futo-notes-core = { path = "../../crates/futo-notes-core" }
futo-notes-model = { path = "../../crates/futo-notes-model" }
futo-notes-store = { path = "../../crates/futo-notes-store" }
futo-notes-sync = { path = "../../crates/futo-notes-sync" }
# `string` lets every help line come from the language catalog at runtime.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
dirs = "6"
hex = "0.4"
libc = "0.2"
# Reads the password from the controlling terminal without echo, leaving stdin
# free for note bodies.
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
