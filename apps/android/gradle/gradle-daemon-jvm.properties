# Pin the JDK the Gradle DAEMON runs on to 21 — the version CI uses
# (.gitlab-ci.yml: JAVA_HOME=/opt/jdk-21).
#
# Not a style preference: Gradle 8.14.3 embeds a Kotlin script compiler whose
# IntelliJ JavaVersion.parse() cannot parse a JDK 25 version string, so on a
# JDK 25 daemon every invocation dies while compiling build.gradle.kts with the
# whole error message being the literal text "25.0.2". JDK 25 is what a current
# Homebrew `openjdk` and Android Studio's bundled JBR both give you, so this
# hits fresh machines, not exotic ones.
#
# The daemon JVM, not the compile task, is the crash site — a kotlin
# jvmToolchain(21) pin does NOT fix it. Java/Kotlin still target 17
# (app/build.gradle.kts compileOptions + kotlinOptions); the toolchain JDK only
# has to be one Gradle can run on.
#
# Gradle must be able to FIND a JDK 21: it is auto-detected when it is the JDK
# gradlew itself launches with (CI, and any dev whose JAVA_HOME is 21), and on
# macOS via /Library/Java/JavaVirtualMachines. A Homebrew openjdk@21 that was
# never symlinked there is invisible to auto-detection — point Gradle at it once
# in ~/.gradle/gradle.properties:
#   org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
toolchainVersion=21
