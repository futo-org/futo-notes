org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin compiler daemon is a separate JVM; unset, it inherits the 2 GB above.
# A tag build compiles four variants (direct/play x debug/release) in that one
# daemon, and 2 GB is the edge: v1.9.0-1 died with "GC overhead limit exceeded"
# in compile*Kotlin, while 1.5 GB fails here every time. Heap is only reserved
# as used, so the headroom costs nothing on the builds that need less.
kotlin.daemon.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
