# Included by .gitlab-ci.yml: the macOS desktop smoke test.
# The cross-device sync e2e suites (pnpm run test:cross-platform) no longer run in CI:
# they flaked when two runs shared a host, and jobs must be able to overlap.

test:desktop-smoke:macos:
  stage: test
  tags:
    - macscript
  variables:
    GIT_STRATEGY: clone
  before_script:
    - env | grep -E '^(CI_)' > "$CI_PROJECT_DIR/.cienv"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - command -v cirrus || brew install cirruslabs/cli/cirrus
    - cirrus run testDesktopSmokeMacOS --artifacts-dir "$CI_PROJECT_DIR" --env-file "$CI_PROJECT_DIR/.cienv"
  artifacts:
    when: always
    paths:
      - testDesktopSmokeMacOS/desktop_smoke/**/*
    expire_in: 1 week
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
    # Every merged change gets the real-binary boot check on the main push.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/tauri/**/*
        - src/**/*
      allow_failure: true
