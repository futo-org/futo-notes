# Included by .gitlab-ci.yml: Playwright end-to-end tests.

test:e2e:rest:
  extends: .ci-test-image
  stage: test
  # Runner 112 — see the `test` job.
  tags:
    - $LINUX_RUNNER_TAG
  # One job, not three shards: each shard took 47-58s wall on runner 112
  # (2026-11, MR pipelines), most of it clone, image start and pnpm install,
  # on runners with 2-5 slots. Playwright still runs --workers=2.
  variables:
    PLAYWRIGHT_JSON: $CI_PROJECT_DIR/test-results/results.json
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - !reference [.setup-playwright, script]
    - pnpm run test:e2e:rest
    # M11: a green exit with zero tests (a broken testMatch) must still fail red.
    - !reference [.check-playwright-ran, script]
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
    # The whole web suite, P0 spec included, runs on main so the P0 crash/IME
    # spec keeps the main coverage the standalone smoke job gave it. Any spec
    # edit re-runs the suite that contains it.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
        - packages/editor/**/*
        - tests/**/*.spec.ts
        - tests/lib/**/*
        - playwright.config.ts
        - package.json
        - pnpm-lock.yaml
        - ci/*.yml
        - .gitlab-ci.yml
