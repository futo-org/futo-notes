# Included by .gitlab-ci.yml: Playwright end-to-end and desktop smoke tests.

test:e2e:smoke:
  extends: .ci-test-image
  stage: test
  # Runner 71 — see the `test` job. Median 2m28 on runner 55 vs 1m37 on runner 71.
  tags:
    - dind_fast
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - !reference [.setup-playwright, script]
    - pnpm run test:e2e:smoke
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
      changes: &web-e2e-smoke-changes
        - src/**/*
        - packages/editor/**/*
        - tests/p0-regressions.spec.ts
        - tests/lib/**/*
        - playwright.config.ts
        - package.json
        - pnpm-lock.yaml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *web-e2e-smoke-changes

test:e2e:rest:
  extends: .ci-test-image
  stage: test
  # Runner 71 — see the `test` job. Median 10m10 on runner 55 vs 3m02 on runner 71.
  tags:
    - dind_fast
  # Three shards by file (188 tests split 63/71/54 on 2026-10-08). Each shard
  # starts its own dev server; the docker executor gives every job its own
  # network namespace, so the shards cannot collide on the port. July's
  # two-shard attempt was undone for oversubscribing runner 55 (58ceb12b7);
  # these run on runner 71 only, where the cost is its five job slots.
  parallel: 3
  variables:
    PLAYWRIGHT_JSON: $CI_PROJECT_DIR/test-results/results.json
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - !reference [.setup-playwright, script]
    # The flag goes straight after the script name, never after `--`; see
    # .check-playwright-shard.
    - pnpm run test:e2e:rest --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
    - !reference [.check-playwright-shard, script]
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    # Same web surface as test:e2e:smoke, plus any spec edit re-runs the
    # suite that contains it.
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - src/**/*
        - packages/editor/**/*
        - tests/**/*.spec.ts
        - tests/lib/**/*
        - playwright.config.ts
        - package.json
        - pnpm-lock.yaml
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true

test:e2e:editor-embed:
  extends: .ci-test-image
  stage: test
  # Runner 71 — see the `test` job. Median 23m30 on runner 55 vs 8m16 on runner 71.
  tags:
    - dind_fast
  # Three shards by file (630 tests split 235/198/197 on 2026-10-08); each
  # shard's globalSetup builds its own editor.html.
  parallel: 3
  variables:
    PLAYWRIGHT_JSON: $CI_PROJECT_DIR/test-results/editor-embed-results.json
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - !reference [.setup-playwright, script]
    # globalSetup builds the single-file editor.html; every test loads it over
    # file:// (no dev server), so the harness drives the SAME bytes the native
    # shells ship. The shard flag goes straight after the script name.
    - pnpm run test:e2e:editor-embed --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
    # M11: a green playwright exit with zero tests must still fail red (a broken
    # testMatch, or an empty shard, would otherwise pass silently).
    - !reference [.check-playwright-shard, script]
  artifacts:
    when: always
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    # Locks the editor-embed <-> native-host futoBridge protocol — auto-run and
    # block on the MRs that can break the embed or its contract.
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - src/editor-embed/**/*
        - src/features/editor/**/*
        # The embed inlines app.css, so a stylesheet change can turn these
        # specs red (they assert rendered geometry and computed token colours).
        - src/styles/**/*
        # The vault filename -> loadable URL mapping both editor engines render
        # images through (features/images/vaultImageSrc.ts) — an MR touching only
        # that file can blank every image in the embed.
        - src/features/images/**/*
        - packages/editor/**/*
        - editor.html
        - vite.editor.config.ts
        # The rest of editor.html's import graph (vite build of
        # vite.editor.config.ts, listed via rollup getModuleIds; RC-21 / L1-005).
        # An MR touching only these still changes the shipped bundle, and used
        # to fall through to manual+allow_failure here (M11). Directory globs,
        # not the per-file graph, so a new import in these dirs stays covered.
        # Kept in sync with test:ios-native's `changes:` (premerge-test-parity
        # test asserts both carry these).
        - src/lib/platform/**/*
        - src/lib/localNoteStore.ts
        - src/lib/rules.ts
        - src/shared/**/*
        - src/features/sync/**/*
        - src/features/notes/**/*
        - src/features/folders/**/*
        - languages/**/*
        - svelte.config.js
        # One glob, not a per-file list: the list missed the T10/T11 additions
        # (webview-floor, milkdown-interactive), silently dropping this job to
        # manual+allow_failure on MRs touching only them (M11). The playwright
        # config discovers specs by the same pattern, so the two can't drift.
        - tests/editor-embed-*.spec.ts
        - tests/milkdown-census/**/*
        - tests/lib/editorEmbedHost.ts
        - tests/editorEmbedBundle.ts
        - playwright.editor-embed.config.ts
        - package.json
        - pnpm-lock.yaml
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
