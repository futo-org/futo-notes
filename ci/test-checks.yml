# Included by .gitlab-ci.yml: the main test job, release-notes checks, and the audit reporters.

# ─────────────────────────────────────────────────────────────
# Tests
# Release tag pipelines run the full validation set automatically. MR
# pipelines auto-run every suite whose `changes:` paths the MR touches; a
# trailing manual+allow_failure rule keeps each suite one click away on
# unrelated MRs. Manual-only is reserved for jobs that publish something
# (build:ci-android-image) or need protected secrets that don't exist on MR
# pipelines (the Windows Proxmox chain — see windows:provision).
# ─────────────────────────────────────────────────────────────

test:
  extends: .ci-test-image
  stage: test
  # Runner 71 (dind_fast), like the three Playwright jobs below. Untagged, ~75%
  # of these jobs landed on runner 55, which ran this one at a 7m15 median
  # against 1m27 on runner 71 (14 days to 2026-10-08): 55 is locked to
  # pull_policy always (130-320s re-pulling the image every job), its pnpm
  # store cache misses (all 449 packages downloaded every job), and it runs up
  # to 11 jobs at once. Runner 71 caps out at five concurrent jobs, so these
  # can queue behind it there; they no longer queue behind a slow box.
  tags:
    - dind_fast
  # Never overlap another pipeline's unit-test job. The contention is between
  # concurrent JOBS on one runner, not within vitest (which already caps
  # maxWorkers:4 in CI): with 3 stacked-MR pipelines in flight,
  # FolderTreeView.test.ts's virtualization cases went from 54/65/52ms to
  # 5397/3619/3408ms — a 60-100x slowdown — and one crossed vitest's 5s default
  # and went red. The assertion was fine and the CPU was not, so this is
  # exclusion, not a longer timeout (M15). Runner 71 is not immune: it shares
  # its five slots with the Rust, sync and Android jobs. Same root-cause fix,
  # and the same mechanism, as the sync suite's resource_group above; a
  # distinct key so the two suites never wait on each other.
  #
  # Cost: the median run on runner 71 is 87s, so a third concurrent MR queues
  # about 3 minutes. That is cheaper than the failure it replaces — a red
  # pipeline plus the attribution hunt.
  #
  # Tag pipelines take unit-tests-release (rules below), so a release never
  # queues behind stacked MRs; it may overlap one MR run, which is the
  # contention above bounded to two jobs. See test:cross-platform-sync.
  #
  # Merge trains would be the other way to stop stacked pipelines overlapping,
  # but gitlab.futo.org runs the EE binary on a Free tier and merge trains are
  # Premium-only (merge_trains_enabled is absent from the project API payload).
  resource_group: $UNIT_TESTS_RESOURCE_GROUP
  variables:
    UNIT_TESTS_RESOURCE_GROUP: unit-tests
  # TIGHTENED from the inherited 60m project default, not bumped: inside a
  # resource group a hung job is head-of-line blocking for every other MR, and
  # hangs are real here (a test:rust:workspace run hung 3870s in the same
  # incident). 15m is twice runner 55's 7m15 median and ten times runner 71's
  # 87s, so a cold pnpm store still fits while a wedged job frees the group in
  # 15m instead of an hour.
  timeout: 15m
  # No scope classifier: this job always runs the full script. A documentation
  # MR pays the pnpm install, and in exchange there is exactly one path that can
  # be reasoned about. The docs gates it used to shortcut to (check-agent-docs,
  # check-qa-input-safety) run here inside check:arch-gate:portable, so nothing
  # a Markdown-only MR could break goes unchecked — which is the db31586c
  # regression this repo already paid for once (M24).
  # `test:` deliberately keeps NO before_script of its own: the override only
  # existed to defer pnpm/Corepack for the deleted docs fast path. Inheriting
  # default.before_script pins Node from .nvmrc via fnm here too, and sets up
  # Corepack/pnpm under that same pinned Node.
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    - sh "$CI_PROJECT_DIR/ci/install-just.sh"
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm exec tsx scripts/gen-toolbar-spec.ts --check
    - pnpm exec tsx "$CI_PROJECT_DIR/scripts/gen-title-spec.ts" --check
    - pnpm run lint
    - pnpm run lint:platform
    - pnpm run check:svelte
    - pnpm run format:check
    # Keep portable anti-duplication gates in the first mandatory MR job.
    # Rust-only dependency boundaries live with the Rust workspace suite.
    - pnpm run check:arch-gate:portable
    - pnpm run test:full
    - pnpm run build
    # Native shells embed this separate single-file bundle. Building it here
    # proves editor changes without compiling two native applications.
    - pnpm exec vite build --config vite.editor.config.ts
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        UNIT_TESTS_RESOURCE_GROUP: unit-tests-release
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Store release notes must exist, and fit, BEFORE anything is built.
#
# The tag pipeline now submits both stores by itself (publish:ios:appstore,
# publish:android), so release-notes/v<X.Y.Z>.md is the ONLY source of the copy
# users read — there is no console step left to fix it in. The notes have to be
# on the tagged commit, so the only remedy for a missing file is a re-tag:
# failing here, in the first minute, is what keeps that from costing a full
# build first. Non-stable tags publish to no store and pass trivially, so
# release:gate can list this job unconditionally (M14).
check:release-notes:
  stage: test
  needs: []
  script:
    - node scripts/release-notes.mjs --tag "$CI_COMMIT_TAG" --check
  rules:
    - if: $CI_COMMIT_TAG

# The same validation on the MR that WRITES the notes, where a fix is an edit
# rather than a re-tag. Checks every committed file, not just the new one.
check:release-notes:mr:
  stage: test
  needs: []
  script:
    - node scripts/release-notes.mjs --all
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - release-notes/**/*
        - scripts/release-notes.mjs
        - scripts/lib/release-notes.mjs

# ── Dependency vulnerability scan ──
# NON-BLOCKING BY DESIGN — do not "fix" this into a hard gate (docs/architecture-gates.md).
# Tags and the default branch run it unconditionally: an advisory appears when the advisory
# database moves, not when our lockfile does.
test:audit:
  stage: test
  needs: []
  allow_failure: true
  variables:
    CARGO_AUDIT_VERSION: '0.22.2'
  # Keyed on the tool VERSION with no `files:` — keying on Cargo.lock would discard the
  # binary on every dependency change.
  cache:
    key: cargo-audit-bin-$CARGO_AUDIT_VERSION
    paths:
      - .cargo-home/bin/
    when: always
  script:
    # The MUSL tarball is statically linked, so it cannot fail on the image's glibc the way
    # binstall's cargo-ndk prebuilt did (build:android-native, GLIBC_2.39). Building from
    # source is not an option — ~315 crates including aws-lc-sys, which needs a C toolchain
    # this image lacks. `|| true` because GitLab stops at the first failing script line,
    # which would skip the marker below.
    - |
      if ! command -v cargo-audit >/dev/null 2>&1; then
        SLUG="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
        mkdir -p "$CARGO_HOME/bin"
        curl -L --proto '=https' --tlsv1.2 -sSf --retry 3 \
          "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${SLUG}.tgz" \
          | tar xz -C "$CARGO_HOME/bin" --strip-components=1 "${SLUG}/cargo-audit" || true
      fi
    # M11: allow_failure renders "advisories found" and "the tool never ran" as the same
    # yellow badge, so AUDIT-DID-NOT-RUN separates them (/ci-doctor greps for it). The delete
    # is load-bearing: the cache is pull-push and `when: always`, so a truncated download
    # would satisfy the `command -v` above forever. No `exit` — the npm half still gates.
    - |
      if ! cargo-audit --version; then
        rm -f "$CARGO_HOME/bin/cargo-audit"
        echo "AUDIT-DID-NOT-RUN: cargo-audit could not be installed; the Rust half was not scanned."
      fi
    # node scripts/audit.mjs is the shared entry point for both CI and a local run.
    - node "$CI_PROJECT_DIR/scripts/audit.mjs"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - Cargo.lock
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .cargo/**/*
        - scripts/audit.mjs
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:localization-audit:
  stage: test
  needs: []
  allow_failure: true
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    - pnpm install --frozen-lockfile --prefer-offline
    - pnpm run audit:languages
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - languages/**/*
        - scripts/language-catalogs.mjs
        - package.json
        - pnpm-lock.yaml
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - languages/**/*
        - scripts/language-catalogs.mjs
        - package.json
        - pnpm-lock.yaml
        - ci/*.yml
        - .gitlab-ci.yml

# Code-quality ratchet (big-code-analysis): a new or WORSENED complexity
# offender fails `bca check` (exit 2) against the committed .bca-baseline.toml;
# existing debt is invisible until its baseline row is deleted, so the MR Code
# Quality widget (gl-code-quality-report.json) annotates only what a diff
# introduced. scripts/bca-quality.mjs owns the pin and the commands; `just
# quality` runs the same script locally.
#
# Every main pipeline runs it, whatever changed: the MR widget diffs an MR's
# report against its base commit's, and a main commit with no report (a
# docs-only push) made every MR list the whole backlog as new. The gate itself
# is scoped to the MR's changed files (scripts/bca-quality.mjs gateArgs).
#
# Non-blocking by design, deliberately absent from release:gate.needs (a
# documented M14 exception, docs/architecture-gates.md): phase 1 of the
# adoption plan, so thresholds and the artifact/cache behave can be observed
# on real pipelines first. Promotion is two same-commit edits: drop
# allow_failure and enter release:gate.needs. Exit 1 + BCA-DID-NOT-RUN means
# the tool never ran (M11); exit 2 means findings.
test:quality-report:
  stage: test
  needs: []
  allow_failure: true
  cache:
    # Keyed on version AND sha256: rotating the published checksum without a
    # version bump must not serve a stale binary that then skips the script's
    # own sha256 verification (which only runs on a fresh download).
    key: bca-bin-2.2.0-870a0c43
    paths:
      - .bca-cache/
    when: always
  script:
    - node "$CI_PROJECT_DIR/scripts/bca-quality.mjs"
  artifacts:
    when: always
    paths:
      - bca-report.md
      - gl-code-quality-report.json
    # An MR's base report must outlive the MR, not just a week of it.
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-report.json
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - src/**/*
        - packages/**/*
        - crates/**/*
        - apps/**/*
        - scripts/bca-quality.mjs
        - bca.toml
        - .bca-baseline.toml
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
