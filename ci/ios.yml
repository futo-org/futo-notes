# Included by .gitlab-ci.yml: native iOS build and tests.

# Native iOS build on the macscript runner via Cirrus (see .cirrus.yml,
# task buildFutoNotesIOSNative). Tags build a signed Release IPA; main builds
# the signed dogfood IPA for TestFlight.
build:ios-native:
  stage: build
  needs: []
  tags:
    - macscript
  variables:
    GIT_STRATEGY: clone
  before_script:
    # IOS_ must pass through: the Cirrus task imports Certificates.p12 with
    # $IOS_CERT_PASSWORD on tag builds. CI_-only here yields an empty
    # password and "MAC verification failed during PKCS12 import".
    - env | grep -E '^(CI_|IOS_)' > "$CI_PROJECT_DIR/.cienv"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - command -v cirrus || brew install cirruslabs/cli/cirrus
    # Delete our stopped VMs left >6 h ago, prune Tart caches unused for 30 days, then record this job's clones (ci/cirrus-vms.sh).
    - bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" sweep || echo "stale-VM sweep failed, see above"
    - export PATH="$CI_PROJECT_DIR/ci/tart-shim:$PATH"
    - cirrus run buildFutoNotesIOSNative --artifacts-dir "$CI_PROJECT_DIR" --env-file "$CI_PROJECT_DIR/.cienv"
  # Runs on failure and cancel too; the next job's sweep catches anything missed.
  after_script:
    - bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" cleanup-job
  artifacts:
    paths:
      - buildFutoNotesIOSNative/binary/*.ipa
      - buildFutoNotesIOSNative/dsyms/*-dSYMs.zip
    expire_in: 4 weeks
  rules:
    # No MR rule: test:ios-native compiles the same FFI sources and app target
    # (only the arm64 simulator slice of the xcframework, where this job adds the
    # device and universal simulator slices; xcodebuild test builds the app
    # target) AND runs the Swift tests, so a second unsigned compile-check here
    # doubled the Mac cost of every iOS-touching MR for no extra signal. test:ios-native's changes:
    # cover this job's former MR paths (apps/ios, futo-notes-ffi, Cargo.lock,
    # build-rust-ios.sh).
    - if: $CI_COMMIT_TAG
    # Every main push ships to TestFlight (publish:ios:main follows this IPA);
    # other main pipelines (web, API) offer it as a button. No changes: filter — editor/UI changes in src/ and
    # packages/editor bundle into the app too.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Native iOS tests on a concrete simulator via Cirrus. This separately
# enforces the FutoNotesNativeTests target that build:ios-native only compiles.
# Runs on iOS-impacting main pushes and on tags. A Linux agent cannot compile
# Swift, so an iOS MR gets its Swift check from the Mac before merge
# (`just ios-native` there). testFutoNotesIOSNative (ci/cirrus/ios-test.yml)
# owns the test tiers and the per-bundle outcome arbiter.
test:ios-native:
  stage: test
  needs: []
  tags:
    - macscript
  variables:
    GIT_STRATEGY: clone
  before_script:
    - env | grep -E '^(CI_|IOS_)' > "$CI_PROJECT_DIR/.cienv"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - command -v cirrus || brew install cirruslabs/cli/cirrus
    # Delete our stopped VMs left >6 h ago, prune Tart caches unused for 30 days, then record this job's clones (ci/cirrus-vms.sh).
    - bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" sweep || echo "stale-VM sweep failed, see above"
    - export PATH="$CI_PROJECT_DIR/ci/tart-shim:$PATH"
    - cirrus run testFutoNotesIOSNative --artifacts-dir "$CI_PROJECT_DIR" --env-file "$CI_PROJECT_DIR/.cienv"
  # Runs on failure and cancel too; the next job's sweep catches anything missed.
  after_script:
    - bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" cleanup-job
  artifacts:
    when: always
    paths:
      - testFutoNotesIOSNative/ios_test_results/**/*
      # The whole xcodebuild output; the job log is the same minus keyboard-renderer noise.
      - testFutoNotesIOSNative/ios_test_log/**/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/ios/**/*
        # FFI paths formerly covered by build:ios-native's MR rule — this job
        # builds the same xcframework + app and runs the Swift tests on top.
        - crates/futo-notes-ffi/**/*
        - Cargo.lock
        - languages/**/*
        - tests/localization/**/*
        - scripts/generate-native-language-resources.mjs
        - tests/conformance/**/*
        - tests/fixtures/editor-native-input/**/*
        - crates/futo-notes-editor/tests/fixtures/**/*
        - scripts/build-rust-ios.sh
        - scripts/ci-ios-test-log.sh
        - scripts/ios-sdk-floor.mjs
        - .cirrus.star
        - ci/cirrus/*.yml
        - .cirrus.yml
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Manual disk check/cleanup for the shared macscript runners (61 futomacoss-mini,
# 110, 111). Jobs cannot pick a runner, so six run at once and each holds its
# runner for five minutes to push the rest onto the others. MAC_RUNNER_CLEAN=1
# also deletes what ci/cirrus-vms.sh can prove is ours; see its header.
maint:mac-runner-disk:
  stage: test
  needs: []
  tags:
    - macscript
  variables:
    GIT_DEPTH: 1
  before_script: []
  parallel: 6
  timeout: 30m
  script:
    - bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" report
    - if [ "${MAC_RUNNER_CLEAN:-}" = 1 ]; then bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" clean; bash "$CI_PROJECT_DIR/ci/cirrus-vms.sh" report; fi
    - env -i /bin/sleep 300
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
