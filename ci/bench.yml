# Included by .gitlab-ci.yml: the editor benchmark, on a serial runner.

# Counts of browser work (elements restyled, layout scope, JS calls) for eight
# editor interactions in headless Chromium, held against
# docs/perf/editor-bench-baseline.json. The counts repeat within 0.15 % on a
# quiet machine and mean nothing on a shared one, so this runs only on the
# futo_notes_serial runner, which runs one job at a time. Main and tags block on
# it; an MR plays it by hand. A red main from a count that got worse is fixed
# by an MR that commits a new baseline with `just bench-climb-gate --accept`
# (docs/perf/editor-bench-climb.md). Exit 1 is REJECT, 2 is a crash (M11).
bench:editor:
  extends: .ci-test-image
  stage: test
  needs: []
  tags:
    - futo_notes_serial
  variables:
    GIT_DEPTH: "20"
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile
    - !reference [.setup-playwright, script]
    - node --experimental-strip-types "$CI_PROJECT_DIR/scripts/perf/editor-bench-gate.mjs" --regression-only
  timeout: 20m
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true

# The editor engine's keystroke cost (bytes parsed, link items, wall time) for
# an engine hill-climb attempt against the commit it started from, both built
# and run twice, interleaved, in this one job on the serial runner. Runs only on
# `engine-climb/*` branches, which `just engine-climb push <name>` creates; read
# verdicts with `just engine-climb results`. Not interruptible: a queued attempt
# is evidence someone is waiting for, so a newer push must not cancel it.
bench:engine-keys:
  extends: .ci-test-image
  stage: test
  needs: []
  tags:
    - futo_notes_serial
  interruptible: false
  variables:
    # The base commit must be in the clone.
    GIT_DEPTH: "0"
  cache:
    # One key for every attempt, so each starts from the last one's build.
    key: engine-climb-$CARGO_CACHE_EPOCH
    paths:
      - .cargo-home/
      - target/
    policy: pull-push
    when: always
  script:
    - !reference [.setup-rust, script]
    - node "$CI_PROJECT_DIR/scripts/engine-climb.mjs" ci
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - engine-climb/summary.txt
      - engine-climb/*.json
  timeout: 45m
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^engine-climb\//
