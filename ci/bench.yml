# Included by .gitlab-ci.yml: the editor benchmark, on a serial runner.

# Counts of browser work (elements restyled, layout scope, JS calls) for eight
# editor interactions in headless Chromium, held against
# docs/perf/editor-bench-baseline.json. The counts repeat within 0.15 % on a
# quiet machine and mean nothing on a shared one, so this runs only on the
# futo_notes_serial runner, which runs one job at a time. It blocks nothing for
# now: main, tags and MRs play it by hand. It had been red on main since
# a3beb27e6 (2026-10-29), +1.4% styledElements opening a large note, likely the
# prosemirror-view 1.42.7 update, and the release gate waited on it. To gate
# again, restore the main/tag rules and the release:gate need. A count that got
# worse is fixed by an MR that commits a new baseline with
# `just bench-climb-gate --accept` (docs/perf/editor-bench-climb.md). Exit 1 is
# REJECT, 2 is a crash (M11).
bench:editor:
  extends: .ci-test-image
  stage: test
  needs: []
  tags:
    - futo_notes_serial
  variables:
    GIT_DEPTH: "20"
  cache:
    - !reference [.cache-pnpm, cache]
    - !reference [.cache-playwright, cache]
  script:
    - pnpm install --frozen-lockfile
    - !reference [.setup-playwright, script]
    - node --experimental-strip-types "$CI_PROJECT_DIR/scripts/perf/editor-bench-gate.mjs" --regression-only
  timeout: 20m
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
