# Appended to .cirrus.yml by .cirrus.star: macOS desktop release and internal builds.

build_macos_task:
  name: buildFutoNotesMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: target/universal-apple-darwin release artifacts, produced by
    # no other task. Tag-only job, so this entry is only refreshed at releases.
    folder: target
    fingerprint_key: futo-notes-target-macos-desktop-$CIRRUS_OS-v1
    reupload_on_changes: true
  buildFutoNotesMacOS_script:
    # Fetch secure files (certificates, API keys)
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash

    # Install signing certificate
    - security unlock-keychain -p "admin" ~/Library/Keychains/login.keychain
    - security import ./.secure_files/MacCertificates.p12 -k ~/Library/Keychains/login.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
    - "security set-key-partition-list -S apple-tool:,apple: -s -k admin ~/Library/Keychains/login.keychain"

    # Set Tauri signing env vars
    - export APPLE_CERTIFICATE=$(base64 < .secure_files/MacCertificates.p12)
    - export APPLE_CERTIFICATE_PASSWORD="$MACOS_CERT_PASSWORD"
    - export APPLE_SIGNING_IDENTITY="Developer ID Application: FUTO Holdings, Inc. (2W7AC6T8T5)"

    # Set Tauri notarization env vars. Tauri reads APPLE_API_KEY as the
    # key ID (NOT a path) and APPLE_API_KEY_PATH as the .p8 file path.
    # Getting these swapped silently disables notarization while codesign
    # still runs, producing signed-but-unnotarized DMGs that Gatekeeper
    # rejects with "Apple could not verify…".
    - export APPLE_API_KEY="$ASC_KEY_ID"
    # Absolute path: the script later cd's into apps/tauri before the build,
    # and notarytool resolves --key relative to cwd. A relative path here
    # silently breaks notarization with "file doesn't exist".
    - export APPLE_API_KEY_PATH="$(pwd)/$(ls .secure_files/AuthKey*.p8 | head -1)"
    - export APPLE_API_ISSUER="$ASC_ISSUER_ID"

    # Install Node + pnpm
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - node --version
    - corepack enable
    - corepack prepare pnpm@10.34.7 --activate

    # Install Rust. We ship a universal (x86_64 + arm64) DMG so a single
    # download runs native on both Apple Silicon and Intel Macs — both target
    # std libs are needed for `--target universal-apple-darwin`.
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    # Pinned: see scripts/drift-registry/tauri-cli-pin.json.
    - cargo install tauri-cli --version 2.11.4 --locked

    # Derive version from git tag
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Building macOS version $VERSION"

    # Install dependencies
    - pnpm install --frozen-lockfile

    # Set desktop/Tauri version sources from git tag.
    - node scripts/desktop-version.mjs "$VERSION"

    # Build universal macOS DMG + the updater bundle. The release overlay turns on
    # createUpdaterArtifacts, so Tauri (in this one build) codesigns + notarizes
    # the .app, then produces .app.tar.gz and minisigns it — correct ordering,
    # no separate re-sign needed. TAURI_SIGNING_PRIVATE_KEY arrives via .cienv;
    # the key has no password and --ci supplies the empty passphrase non-interactively.
    - test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
    # target/ is cached, so bundle/ still holds the previous run's output. DMG
    # names carry the version, so a stale one would ride along with the
    # `*.dmg` copy below into the release artifacts.
    - rm -rf target/universal-apple-darwin/release/bundle
    - cd apps/tauri
    - cargo tauri build --target universal-apple-darwin --config src-tauri/tauri.updater-release.conf.json --ci
    - cd ../..

    # Copy DMG (installer) + the updater artifact (.app.tar.gz + .sig) to the
    # artifact locations. macOS updater downloads the .app.tar.gz, NOT the .dmg.
    - cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ./
    - mkdir -p updater && cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz updater/ && cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig updater/
  # A cache's auto-generated upload inherits the cache instruction's ON_SUCCESS
  # behavior, so a task that dies mid-compile (or hits the wall) uploads
  # nothing and dooms every retry to another cold start — the exact hazard
  # .gitlab-ci.yml's cache templates carry `when: always` for. Moving the
  # uploads into `always:` via `upload_caches` fixes that; cargo handles a
  # partial target/ fine. NOTE: naming ANY cache here disables the automatic
  # upload for ALL of them, so this list must stay exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
  binary_artifacts:
    path: "*.dmg"
  updater_artifacts:
    path: "updater/*"

# Internal, hosted-enabled macOS build (D2, taken —
# hosted-sync staging plan, ticket C8). Invoked ONLY by
# .gitlab-ci.yml's build:desktop-internal:macos, on prerelease tags.
#
# Deliberately receives none of MACOS_CERT_PASSWORD/ASC_KEY_ID/ASC_ISSUER_ID/
# TAURI_SIGNING_PRIVATE_KEY — build:desktop-internal:macos exports only CI_*
# into .cienv, so no Apple certificate, no notarization credential, and no
# updater signing key ever reaches this VM. Building with the base
# tauri.conf.json (no --config override, unlike build_macos_task above) means
# there is no `createUpdaterArtifacts` and so no .sig/.app.tar.gz this job
# could produce even if it tried — the same M23 guarantee build_macos_task's
# updater-release config exists to prove, held here by simply never wiring
# the secrets or the config in. The DMG is unsigned; testers bypass
# Gatekeeper (right-click → Open, or `xattr -d com.apple.quarantine`).
build_macos_internal_task:
  name: buildFutoNotesMacOSInternal
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob, NOT shared with buildFutoNotesMacOS despite the same target
    # triple: this build bakes VITE_HOSTED_SYNC / FUTO_HOSTED_SERVER_BAKED and
    # skips the release updater overlay, so one shared blob would flip-flop
    # between the two configurations on every alternating run.
    folder: target
    fingerprint_key: futo-notes-target-macos-internal-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_tauri_cli_cache:
    # Same key as testDesktopSmokeMacOS, so both run the one pinned tauri-cli
    # that desktop-smoke already exercises on every MR. Unlike
    # buildFutoNotesMacOS this is an unsigned internal build, not a release
    # DMG, so a pinned CLI here carries no release risk. See the note on
    # testDesktopSmokeMacOS's copy for why it lives outside $HOME/.cargo/bin.
    folder: .cirrus-cargo-bin
    fingerprint_key: futo-notes-cargo-tauri-cli-$CIRRUS_OS-v1
    reupload_on_changes: true
  buildFutoNotesMacOSInternal_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - node --version
    - corepack enable
    - corepack prepare pnpm@10.34.7 --activate

    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    - |
      TAURI_CLI_ROOT="$PWD/.cirrus-cargo-bin"
      if [ -x "$TAURI_CLI_ROOT/bin/cargo-tauri" ]; then
        echo "cargo-tauri restored from cache: $("$TAURI_CLI_ROOT/bin/cargo-tauri" --version)"
      else
        cargo install tauri-cli --version 2.11.4 --locked --root "$TAURI_CLI_ROOT"
      fi
      export PATH="$TAURI_CLI_ROOT/bin:$PATH"
      command -v cargo-tauri

    # Tag builds derive the version from the tag; MR rehearsal builds have no
    # tag, so fall back to 0.0.0 (same fallback build:windows uses in
    # .gitlab-ci.yml) rather than passing desktop-version.mjs an empty string.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if [ -z "$VERSION" ]; then
        VERSION="0.0.0"
      fi
    - echo "Building internal macOS version $VERSION (hosted sync ON, staging server)"

    - pnpm install --frozen-lockfile
    - node scripts/desktop-version.mjs "$VERSION"

    - export VITE_HOSTED_SYNC=true
    - export FUTO_HOSTED_SERVER_BAKED=https://staging-notes-sync.futo.org
    - unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD

    # Same as buildFutoNotesMacOS: clear the cached bundle/ so a previous
    # run's versioned DMG cannot ride along with the `*.dmg` copy below.
    - rm -rf target/universal-apple-darwin/release/bundle
    - cd apps/tauri
    - cargo tauri build --target universal-apple-darwin
    - cd ../..

    - cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ./
  # See the note on testRustMacOS's upload_caches: naming any cache disables
  # the automatic upload for all of them, so this list stays exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
      - cargo_tauri_cli
  binary_artifacts:
    path: "*.dmg"
