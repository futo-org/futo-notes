# Included by .gitlab-ci.yml: Rust workspace, macOS, and Android FFI tests.

test:rust:workspace:
  extends: .ci-test-image
  stage: test
  needs: []
  # The runners only have node-local Cargo caches today. Keep Rust workspace
  # tests on the fast office runner that already owns the warm archive until
  # the R2 distributed cache is configured on every runner manager.
  tags:
    - $LINUX_RUNNER_TAG
  variables:
    CARGO_CACHE_POLICY: pull
  cache:
    - !reference [.cache-cargo-tauri, cache]
    - !reference [.cache-pnpm, cache]
  script:
    # `cargo test --workspace` compiles the futo-notes-tauri desktop crate,
    # which links gtk-sys/gobject-sys and needs the GTK/WebKit dev libs.
    # .ci-test-image already includes them; .setup-linux-deps is a no-op there
    # and supplies them if this job is moved to an image without baked deps.
    - !reference [.setup-linux-deps, script]
    - !reference [.setup-rust, script]
    # One metadata traversal replaces the former standalone dep-guard job.
    # The workspace tests already contain model conformance coverage.
    - node scripts/check-rust-dependency-boundaries.mjs
    # Existing blocking Rust job/release gate also runs the actual WASM consumer.
    # Its payload drift check parses wasmPayloads.d.ts with `typescript`.
    - pnpm install --frozen-lockfile --prefer-offline
    - node "$CI_PROJECT_DIR/scripts/test-editor-wasm.mjs"
    # Windows is the only non-Unix target we ship, and its build is tag-only
    # and slow, so a cfg-gating mistake in the `cfg(not(unix))` vault layer or
    # in platform-gated test scaffolding is otherwise found at release time at
    # the earliest. github#48's fix hit exactly that: `cargo test -p
    # futo-notes-core` had never compiled on Windows at all. Type-checking that
    # target needs no linker and no MSVC, and futo-notes-core is the one crate
    # with no C dependencies (ring/zstd-sys need lib.exe), so it is the crate
    # this can cover — which is also the crate that owns the platform branches.
    - rustup target add x86_64-pc-windows-msvc
    - cargo check --target x86_64-pc-windows-msvc --tests -p futo-notes-core
    - mkdir -p dist
    # Same command as `just rust-lint`: [workspace.lints] denies the print
    # macros that panic (and abort the release app) once stderr is gone.
    - cargo clippy --workspace
    - node "$CI_PROJECT_DIR/scripts/rust-tests.mjs" workspace
    # The CLI's sign-in and sync tests are #[ignore]d in a plain workspace run
    # because they start the pinned sync server; run them here against it.
    - !reference [.setup-futo-notes-server, script]
    - cargo test -p futo-notes-cli --test server -- --ignored
    - node --experimental-strip-types "$CI_PROJECT_DIR/tests/conformance/title-rules-differential.mjs"
  # Job 189242 exhausted the default 60m on a completely cold cache while
  # still compiling dependencies. Give that first run enough wall time to
  # finish and seed the existing when:always Cargo cache; warm runs remain
  # unchanged. This is the same cold-cache policy used by the native builds.
  timeout: 90m
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
      variables:
        CARGO_CACHE_POLICY: pull-push
    - if: $CI_MERGE_REQUEST_IID
      changes: &rust-workspace-changes
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - .config/nextest.toml
        - scripts/test-editor-wasm.mjs
        - scripts/rust-tests.mjs
        - scripts/cargo-nextest-pin.json
        - ci/install-nextest.sh
        - .cargo/**/*
        - crates/**/*
        # Every TypeScript copy the note-rule differential runs against Rust
        # (tests/conformance/title-rules-differential.mjs). Listing only
        # filename.ts left a tags/preview/image/wikilink drift able to merge
        # without this job ever running.
        - packages/editor/src/filename.ts
        - packages/editor/src/tags.ts
        - packages/editor/src/preview.ts
        - packages/editor/src/images.ts
        - src/shared/note/wikilinks.ts
        - packages/editor/src/wasmPayloads.d.ts
        - apps/tauri/src-tauri/**/*
        - apps/tauri/Cargo.toml
        - apps/cli/**/*
        # The CLI reads its text from the catalog at build time.
        - languages/en.json
        - scripts/lib/sync-server.mjs
        - scripts/sync-server-pin.json
        - src/features/sync/syncContract.generated.ts
        - scripts/build-rust-android.sh
        - scripts/build-rust-ios.sh
        - scripts/check-rust-dependency-boundaries.mjs
        - tests/conformance/**/*
        - tests/fixtures/editor-native-input/**/*
        # CI config changes can alter this job's toolchain/system-dep setup
        # (e.g. the GTK deps it needs to compile the tauri crate) — re-run the
        # workspace tests so an environment break is caught on that change.
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *rust-workspace-changes
      variables:
        CARGO_CACHE_POLICY: pull-push

test:rust:macos:
  stage: test
  tags:
    - macscript
  # Force a clean clone each run — the macscript runner's incremental fetch
  # kept hitting `missing blob object / remote did not send all necessary
  # objects` on a stale local .git.
  variables:
    GIT_STRATEGY: clone
  before_script:
    - env | grep -E '^(CI_)' > "$CI_PROJECT_DIR/.cienv"
  script:
    - export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
    - command -v cirrus || brew install cirruslabs/cli/cirrus
    - cirrus run testRustMacOS --artifacts-dir "$CI_PROJECT_DIR" --env-file "$CI_PROJECT_DIR/.cienv"
  rules:
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
    # No auto MR rule: the MR run was only an allow_failure iOS compile check
    # (test:rust:workspace is the hard Linux gate, test:ios-native builds the
    # FFI crate for iOS), so main pushes and tags take it; MRs can start it
    # by hand below.
    # Full macOS workspace tests on Rust-touching main pushes, so a macOS-only
    # break surfaces before tag time (M13) instead of first failing on the tag.
    # All of crates/ and the desktop crate: this is the full test run, not the
    # MR compile check.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - .config/nextest.toml
        - scripts/rust-tests.mjs
        - scripts/cargo-nextest-pin.json
        - ci/install-nextest.sh
        - crates/**/*
        - apps/tauri/src-tauri/**/*
        - scripts/build-rust-ios.sh
        - .cirrus.star
        - ci/cirrus/*.yml
        - .cirrus.yml
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true

# The full native app builds only run when a shell or futo-notes-ffi itself
# changes, but every futo-notes crate sits in the FFI dependency tree — an
# inner-crate change can break mobile-target compilation while desktop tests
# stay green, and would then surface for the first time at tag time. Compile
# and link the FFI cdylib for ONE Android ABI (same platform/profile as
# scripts/build-rust-android.sh, so the native Cargo cache is reused) to keep
# mobile Rust coverage on every crate change without paying for two full
# native app builds. The iOS-target sibling check lives in the testRustMacOS
# Cirrus task (.cirrus.yml) because Apple targets need the macOS SDK. Neither
# check exercises the generated Swift/Kotlin bindings or shell integration —
# that remains native-build-only coverage.
test:rust:ffi-android:
  stage: test
  needs: []
  # A shared-slot runner. The sync suites run alone on the serial runner now,
  # so this full-tree compile can no longer starve them (pipeline 31084's
  # "rapid reconnect" flake was that overlap); the project-wide lock and the
  # needs: ordering that kept the two apart are gone with it.
  tags:
    - $LINUX_RUNNER_TAG
  extends: .ci-android-image
  # Own single-ABI cache namespace instead of the fat 3-ABI + host `native`
  # archive: restoring that one costs more than this job's warm compile.
  # Two MRs may upload this key at once; GitLab replaces the archive whole,
  # so the loser's upload is wasted, never corrupting.
  cache:
    key:
      prefix: ffi-check
      files:
        - Cargo.lock
    paths:
      - .cargo-home/
      - target/
    policy: pull-push
    when: always
  variables:
    GIT_DEPTH: '20'
    # See build:android-native for why ANDROID_NDK_HOME must be set explicitly.
    ANDROID_NDK_HOME: /opt/android-sdk/ndk/28.2.13676358
  script:
    - !reference [.setup-rust, script]
    - rustup target add aarch64-linux-android
    # cargo-ndk from source when the cached binary is missing — see
    # build:android-native for the binstall/GLIBC constraint.
    - |
      if command -v cargo-ndk >/dev/null 2>&1; then
        echo "cargo-ndk already installed (cached)"
      else
        cargo install cargo-ndk --locked
      fi
    - cargo ndk --platform 24 --target arm64-v8a build -p futo-notes-ffi --profile release-ffi --locked
  # One ABI on a cold cache still compiles the whole dependency tree; the warm
  # office-runner path is minutes.
  timeout: 60m
  rules:
    # build:android-native builds this same crate (arm64 included) whenever
    # these paths change; keep the list equal to its native-android-changes
    # (premerge-test-parity asserts it).
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - apps/android/**/*
        - crates/futo-notes-ffi/**/*
        - Cargo.lock
        - languages/**/*
        - tests/localization/**/*
        - scripts/generate-native-language-resources.mjs
        - scripts/build-rust-android.sh
        - scripts/ci-android-instrumentation.sh
        - scripts/ci-android-emulator.sh
        - scripts/ci-android-sync-leg.sh
        - tests/cross-platform-sync.mjs
        - tests/cross-platform-sync/**/*
        - tests/lib/**/*
        - scripts/sync-server-pin.json
        - scripts/lib/sync-server.mjs
      when: never
    - !reference [.not-scheduled, rules]
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
      changes: &rust-ffi-mobile-changes
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - .config/nextest.toml
        - scripts/rust-tests.mjs
        - scripts/cargo-nextest-pin.json
        - ci/install-nextest.sh
        - .cargo/**/*
        - crates/**/*
        - scripts/build-rust-android.sh
        - ci/*.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *rust-ffi-mobile-changes
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
