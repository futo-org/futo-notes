# Included by .gitlab-ci.yml: the internal GitLab release.

# ─────────────────────────────────────────────────────────────
# Internal release — hosted-enabled Android + desktop builds, prerelease
# tags only (D2, taken — hosted-sync staging plan, ticket C8)
# ─────────────────────────────────────────────────────────────
# Distribution for the hosted-enabled builds that already exist and go
# nowhere: build:android-native turns hosted sync on for a prerelease tag
# (C3) but publish:android is stable-tag-only, and there was no desktop build
# with the flag on at all outside `just tauri-dev`. This publishes exactly
# what build:android-native and build:desktop-internal:{linux,macos,windows}
# produced as GitLab release assets, so a FUTO person can install one without
# a terminal or a Rust/Android toolchain.
#
# Deliberately a SEPARATE job from `release:`, not a shared rule branch on it,
# so M23 holds by construction rather than by a careful `if`:
#   - `release:`'s own `needs:` and `rules:` (stable tags only) are untouched
#     by this ticket — this job does not appear anywhere in them, so a
#     prerelease-tag pipeline can never make `release:` itself run, let alone
#     publish.
#   - This job's script never calls scripts/build-updater-manifest.mjs or
#     scripts/verify-updater-signature.mjs, and never writes/uploads a
#     latest.json — those lines simply do not exist here.
#   - It uploads to a DIFFERENTLY NAMED generic package (futo-notes-internal,
#     not futo-notes) at a path release:'s script never references, so the
#     two artifact trails cannot collide even by a typo.
#   - The desktop artifacts it publishes were built from the base
#     tauri.conf.json (build:desktop-internal:{linux,macos,windows}), which
#     has no `createUpdaterArtifacts` — there is no .sig for this job to
#     embed into a manifest even if it tried. Windows additionally never
#     runs windows:sign (Authenticode + minisign) at all — see the comment
#     on windows:provision:internal for why signing is deliberately withheld.
# Not a test job (M14): it publishes artifacts other jobs already validated,
# so it does not enter release:gate.needs — it DEPENDS on release:gate
# instead, reusing the full test-suite + standard-build quality bar before
# publishing an internal build.
release:internal:
  stage: release
  interruptible: false
  needs:
    - job: release:gate
    - job: build:android-native
      artifacts: true
    - job: build:desktop-internal:linux
      artifacts: true
    - job: build:desktop-internal:macos
      artifacts: true
    - job: build:desktop-internal:windows
      artifacts: true
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/futo-notes-internal/${CI_COMMIT_TAG}"
    # Every artifact kind must resolve to EXACTLY ONE file: the old for-loops
    # uploaded every match under one fixed name (last in glob order won), and
    # the stale deb/rpm restored from the cache made that three uploads each
    # on v1.9.0-3 (M11). No `set -e` is active, so each call aborts explicitly.
    - |
      upload_one() {
        dir="$1"; pattern="$2"; name="$3"
        count=$(find "$dir" -type f -name "$pattern" 2>/dev/null | wc -l)
        if [ "$count" -ne 1 ]; then
          echo "expected exactly one $pattern under $dir, found $count:" >&2
          find "$dir" -type f -name "$pattern" 2>/dev/null >&2
          return 1
        fi
        f=$(find "$dir" -type f -name "$pattern")
        echo "Uploading $name"
        curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "${REGISTRY_URL}/${name}"
      }
      # Android APK (hosted sync ON, staging server — build:android-native, C3)
      upload_one apps/android/app/build/outputs/apk/direct/release "*release*.apk" "futo-notes-internal-${VERSION}.apk" || exit 1
      # Linux (deb/rpm/AppImage) — unsigned by the updater key, see the job
      # comment on build:desktop-internal:linux.
      upload_one target/release/bundle/deb "*.deb" "futo-notes-internal_${VERSION}_amd64.deb" || exit 1
      upload_one target/release/bundle/rpm "*.rpm" "futo-notes-internal-${VERSION}-1.x86_64.rpm" || exit 1
      upload_one target/release/bundle/appimage "*.AppImage" "FUTO-Notes-Internal-${VERSION}-x86_64.AppImage" || exit 1
      # macOS DMG — unsigned/un-notarized, see build:desktop-internal:macos.
      upload_one buildFutoNotesMacOSInternal "*.dmg" "FUTO-Notes-Internal-${VERSION}-universal.dmg" || exit 1
      # Windows NSIS installer — unsigned, see windows:provision:internal.
      upload_one windows-internal-artifacts "*.exe" "FUTO-Notes-Internal-${VERSION}-x64-setup.exe" || exit 1
    - |
      curl -sL "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64" \
        -o /usr/local/bin/release-cli && chmod +x /usr/local/bin/release-cli
    # Retag-same-version dance, same as `release:` — delete any existing
    # Release for this tag before recreating (release-cli create 409s otherwise).
    - |
      curl -s -X DELETE -H "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" || true
    # Backdate the Release. GitLab resolves `releases/permalink/latest` by
    # released_at, and the desktop updater's baked endpoint is
    # .../releases/permalink/latest/downloads/latest.json. An internal release
    # stamped "now" therefore becomes `latest`, has no latest.json, and every
    # production client's update check 404s until the next stable release
    # (v1.9.0-3: about 08:55-08:59 UTC). A fixed far-past released_at keeps it
    # permanently behind every stable release, so it can never win.
    # scripts/release-channel.test.mjs fails if this flag goes missing.
    - |
      release-cli create \
        --released-at "2000-01-01T00:00:00Z" \
        --name "FUTO Notes ${CI_COMMIT_TAG} (INTERNAL — hosted sync, staging server)" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "INTERNAL FUTO-only build. Hosted sync (\"Log in with FUTO\") is ON and points at the STAGING server (staging-notes-sync.futo.org), never production. Desktop builds are unsigned (Linux, Windows) or un-notarized (macOS) — bypass Gatekeeper/SmartScreen/right-click Open as needed. Not for external distribution, and not reachable from the in-app updater (no manifest exists for this release)." \
        --assets-link "{\"name\":\"futo-notes-internal-${VERSION}.apk\",\"url\":\"${REGISTRY_URL}/futo-notes-internal-${VERSION}.apk\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"futo-notes-internal_${VERSION}_amd64.deb\",\"url\":\"${REGISTRY_URL}/futo-notes-internal_${VERSION}_amd64.deb\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"futo-notes-internal-${VERSION}-1.x86_64.rpm\",\"url\":\"${REGISTRY_URL}/futo-notes-internal-${VERSION}-1.x86_64.rpm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"FUTO-Notes-Internal-${VERSION}-x86_64.AppImage\",\"url\":\"${REGISTRY_URL}/FUTO-Notes-Internal-${VERSION}-x86_64.AppImage\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"FUTO-Notes-Internal-${VERSION}-universal.dmg\",\"url\":\"${REGISTRY_URL}/FUTO-Notes-Internal-${VERSION}-universal.dmg\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"FUTO-Notes-Internal-${VERSION}-x64-setup.exe\",\"url\":\"${REGISTRY_URL}/FUTO-Notes-Internal-${VERSION}-x64-setup.exe\",\"link_type\":\"package\"}"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
