default:
  tags:
    - dind
  # Keep the lightweight org image as the default for the untagged jobs that
  # can land on runner 55, which refuses .ci-test-image's pull policy. Jobs
  # pinned to runner 71 (dind_fast) opt into that larger image below.
  image: gitlab.futo.org:5050/futocore/ci/kitchensink@sha256:2df4951967506d9dc31ad4dea6d7b03eb4ddea21f3bd5e500ef3d3be924e589f
  interruptible: true
  before_script:
    # The shared base image is another team's and has no fnm, and our own images
    # only gain it on a manual rebuild — so bootstrap rather than assume. It is a
    # no-op wherever fnm is already baked in.
    - sh "$CI_PROJECT_DIR/ci/install-fnm.sh"
    # Reads .nvmrc from $CI_PROJECT_DIR, and exits non-zero rather than falling
    # back to another Node.
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - export PATH="$CARGO_HOME/bin:$PATH"

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # Main/tag pipelines seed shared Cargo archives. Source-only MRs consume
  # them without spending minutes recompressing tens of thousands of unchanged
  # target files; lockfile MRs opt back into pull-push in their job rules.
  CARGO_CACHE_POLICY: pull-push
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
  PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache-ms-playwright
  # Base images are pinned by digest so a registry `:latest` cannot swap the
  # toolchain under a pipeline. These two are referenced by several jobs each, so
  # the digest lives here and the jobs carry no copy of it. The AppImage signing
  # jobs deliberately do NOT use a variable: `variables:` here loses to a
  # run-pipeline variable, and those two jobs hold the production updater key.
  #
  # ci/android is OURS, rebuilt by `build:ci-android-image` (manual). That job
  # pushes `:latest`; moving consumers onto the new bytes is a deliberate edit of
  # this line, the same follow-up-commit dance `.ci-test-image` documents. Resolve
  # a new digest through project registry repository 163.
  IMAGE_ANDROID: gitlab.futo.org:5050/futo-notes/futo-notes/ci/android@sha256:afed1a7a22a312e1948a7f3b464b138b516dd1149aa3bd8d0aa69827496b7f42
  #
  # quay garbage-collects manifests no tag points at, and this pin is EXPECTED
  # TO DIE PERIODICALLY. Picking a digest that an exact version tag also held
  # was tried and did not help: sha256:8eca9c2b… was shared by v1.43.2, v1.43,
  # v1 and latest when it was pinned, and 12 days later it 404'd
  # ("manifest unknown") because upstream had rebuilt and moved every one of
  # those tags off it. There is no digest here that stays resolvable forever.
  #
  # So: when `build:ci-android-image` or `build:ci-test-image` fails to pull
  # with "manifest unknown", the pin is dead — re-resolve and update this line
  # (do NOT switch it back to a floating tag; the point of the pin is that a
  # registry `:latest` cannot swap the toolchain under a pipeline):
  #   skopeo inspect --raw docker://quay.io/buildah/stable:v1.43.2 | sha256sum
  # or read the `Docker-Content-Digest` response header from
  #   GET https://quay.io/v2/buildah/stable/manifests/v1.43.2
  # (Accept: application/vnd.oci.image.index.v1+json). Both must agree, and the
  # raw manifest must be an OCI index containing a linux/amd64 entry — the
  # runners are amd64 and the index lists ppc64le first.
  #
  # Both jobs using this are `when: manual` and web-pipeline only, so no MR
  # pipeline pulls the image; a dead pin surfaces only when someone rebuilds.
  IMAGE_BUILDAH: quay.io/buildah/stable@sha256:83045a38da942948cbe8ce53fcf32d76b2d9bfad33bc4586d804522030efc64f

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - collect-secrets
  - test
  - build
  - verify
  - release
  - trigger

# Jobs live in ci/*.yml, one file per job group, merged in this order. A YAML
# anchor (&name / *name) resolves only inside its own file, so a template used
# from another file is reached with `extends:` or `!reference`.
include:
  - local: ci/secrets.yml
  - local: ci/templates.yml
  - local: ci/test-checks.yml
  - local: ci/test-e2e.yml
  - local: ci/test-rust.yml
  - local: ci/test-sync.yml
  - local: ci/build-linux.yml
  - local: ci/build-desktop-internal.yml
  - local: ci/build-images.yml
  - local: ci/android.yml
  - local: ci/ios.yml
  - local: ci/windows.yml
  - local: ci/windows-internal.yml
  - local: ci/publish.yml
  - local: ci/release.yml
  - local: ci/release-internal.yml
  - local: ci/package-repos.yml
