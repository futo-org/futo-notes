# Cirrus has no YAML include: .cirrus.star appends the tasks in ci/cirrus/*.yml
# to this file before the config is parsed, so they read as one document.

# ─────────────────────────────────────────────────────────────
# Cargo caching on the single macscript runner
# ─────────────────────────────────────────────────────────────
# Every task here boots a FRESH Tart VM, so without a cache each one recompiles
# the whole Rust workspace from zero — job traces show 1064 / 1088 / 1091
# "Compiling" lines for build:ios-native / test:ios-native / desktop-smoke.
# The `cache` instruction fixes that. Under `cirrus run` (the CLI, not Cirrus
# Cloud) each cache blob is stored on the RUNNER ITSELF, in
# ~/Library/Caches/cirrus/projects/<project>/<key> (Go's os.UserCacheDir), so a
# single-machine runner needs no CIRRUS_HTTP_CACHE_HOST and no extra flag on
# the `cirrus run` lines in .gitlab-ci.yml. The blob is restored into the VM
# before the task's scripts run.
#
# Why a CONSTANT `fingerprint_key` rather than hashing Cargo.lock: the CLI's
# local blob store has NO eviction — nothing ever deletes an entry. A key
# derived from Cargo.lock would strand a multi-GB orphan on the mini's disk
# after every lockfile bump, and would hand a fully cold build to exactly the
# MRs that touch Cargo.lock. A constant key gives exactly ONE blob per entry,
# rewritten in place each run (`reupload_on_changes: true` — it defaults to
# false whenever a fingerprint is set, so it has to be explicit), and a hit on
# every run: cargo, not the cache key, decides what to recompile. Bump the
# trailing -vN of a key to force a cold rebuild and drop the old blob.
#
# Restoring `target/` reintroduces the mtime-skew hazard that
# scripts/ci-cargo-cache-freshness.mjs exists for (see its header, and
# .setup-rust in .gitlab-ci.yml): the cache lands AFTER the sources, so a
# restored rlib can carry an mtime newer than the source it was built from and
# cargo — which decides freshness by mtime, never by content — calls it fresh
# and skips the rebuild. Pipeline 33129 / job 211040 died that way on Linux.
# Every task below therefore runs that same shared guard before its first cargo
# invocation. CI_PROJECT_DIR has to be re-pointed for it: .cienv carries the
# GitLab runner's value, which is a host path that does not exist in the VM.
#
# Cache scope is per task family, keyed by which target/ subdirs the task fills
# (host debug vs. the three release-ffi iOS triples vs. universal-apple-darwin
# release). One shared blob would make every task upload the union of all of
# them.

test_rust_macos_task:
  name: testRustMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: this task fills target/debug (cargo test --workspace) and
    # target/aarch64-apple-ios/debug (the cargo check), which is a different set
    # from the release-ffi libs the iOS tasks build.
    folder: target
    fingerprint_key: futo-notes-target-test-rust-macos-$CIRRUS_OS-v1
    reupload_on_changes: true
  testRustMacOS_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - corepack enable
    - corepack prepare pnpm@10.34.7 --activate
    - pnpm install --frozen-lockfile
    - mkdir -p dist
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    # Whole workspace so the new core crates (model/index/sync) are covered on
    # macOS too; ignored server tests stay skipped (no FUTO_TEST_SERVER).
    # Except the CLI: docs/spec/cli.md supports Linux only ("built and tested
    # there and nowhere else"), and its tests assume the Linux XDG layout;
    # scripts/rust-tests.mjs leaves futo-notes-cli out on non-Linux hosts.
    # Main pushes and tags only: on MR pipelines the same command is already
    # the hard Linux gate (test:rust:workspace), and rerunning it here spent
    # ~6 min of the single macscript runner per Rust MR for an allow_failure
    # result. MRs keep only the iOS compile check below.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || { [ -n "${CI_DEFAULT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; }; then
        node "${CIRRUS_WORKING_DIR:-$PWD}/scripts/rust-tests.mjs" workspace
      else
        echo "MR pipeline: skipping full Rust workspace tests (hard-gated on Linux in test:rust:workspace); running the iOS target check only"
      fi
    # Mobile-target compile check: the full iOS app build only runs when the
    # shell or futo-notes-ffi itself changes, but every futo-notes crate is in
    # the FFI dependency tree. Type-check the tree for the device target so an
    # inner-crate iOS break surfaces on the MR instead of at tag time. The
    # Android sibling (which also links) is test:rust:ffi-android in GitLab.
    - rustup target add aarch64-apple-ios
    - cargo check -p futo-notes-ffi --target aarch64-apple-ios --locked
  # A cache's auto-generated upload inherits the cache instruction's ON_SUCCESS
  # behavior, so a task that dies mid-compile (or hits the wall) uploads
  # nothing and dooms every retry to another cold start — the exact hazard
  # .gitlab-ci.yml's cache templates carry `when: always` for. Moving the
  # uploads into `always:` via `upload_caches` fixes that; cargo handles a
  # partial target/ fine. NOTE: naming ANY cache here disables the automatic
  # upload for ALL of them, so this list must stay exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target

test_desktop_smoke_macos_task:
  name: testDesktopSmokeMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: host debug build of the tauri crate (cargo tauri build
    # --debug), which no other task produces.
    folder: target
    fingerprint_key: futo-notes-target-desktop-smoke-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_tauri_cli_cache:
    # `cargo install tauri-cli` is a multi-minute compile all of its own that
    # the target/ cache above does NOT cover — cargo install builds in a
    # throwaway temp dir. So cache the installed binary instead, under a
    # working-dir root rather than $HOME/.cargo/bin, which the sh.rustup.rs
    # bootstrap rewrites on every run. Same trade .setup-rust already makes on
    # the Linux jobs (it caches .cargo-home/, bin included): once the binary is
    # cached its version is pinned, so bump -vN to pick up a newer tauri-cli.
    # Deliberately NOT applied to buildFutoNotesMacOS: that task is tag-only, so
    # no MR pipeline can exercise it, and a silently pinned tauri-cli there
    # would first show up in a release DMG.
    folder: .cirrus-cargo-bin
    fingerprint_key: futo-notes-cargo-tauri-cli-$CIRRUS_OS-v1
    reupload_on_changes: true
  testDesktopSmokeMacOS_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - corepack enable
    - corepack prepare pnpm@10.34.7 --activate
    - pnpm install --frozen-lockfile
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    - |
      TAURI_CLI_ROOT="$PWD/.cirrus-cargo-bin"
      if [ -x "$TAURI_CLI_ROOT/bin/cargo-tauri" ]; then
        echo "cargo-tauri restored from cache: $("$TAURI_CLI_ROOT/bin/cargo-tauri" --version)"
      else
        cargo install tauri-cli --version 2.11.4 --locked --root "$TAURI_CLI_ROOT"
      fi
      export PATH="$TAURI_CLI_ROOT/bin:$PATH"
      command -v cargo-tauri
    # Build frontend + debug binary
    - pnpm run build
    - (cd apps/tauri && cargo tauri build --debug --no-bundle)
    # Pre-configure notes dir so app boots to editor
    - |
      NOTES_DIR=$(mktemp -d)
      mkdir -p "$HOME/Library/Application Support/com.futo.notes"
      echo '{"notesDir":"'"$NOTES_DIR"'"}' > "$HOME/Library/Application Support/com.futo.notes/notes-dir-override.json"
    # Launch (Cirrus macOS VMs have a display — no xvfb needed). Log +
    # screenshots land under the repo checkout (not /tmp) so the always:
    # artifacts block below can copy them out via --artifacts-dir.
    - mkdir -p test-screenshots
    - |
      target/debug/futo-notes-tauri > test-screenshots/tauri-smoke.log 2>&1 &
    # Run smoke tests (script handles port discovery from log)
    - node tests/desktop-smoke.mjs --log-file test-screenshots/tauri-smoke.log
    - kill $(pgrep -f futo-notes-tauri) 2>/dev/null || true
  always:
    # See the note on testRustMacOS's upload_caches: naming any cache disables
    # the automatic upload for all of them, so this list stays exhaustive.
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
      - cargo_tauri_cli
    desktop_smoke_artifacts:
      path: "test-screenshots/**"
