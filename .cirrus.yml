# ─────────────────────────────────────────────────────────────
# Cargo caching on the single macscript runner
# ─────────────────────────────────────────────────────────────
# Every task here boots a FRESH Tart VM, so without a cache each one recompiles
# the whole Rust workspace from zero — job traces show 1064 / 1088 / 1091
# "Compiling" lines for build:ios-native / test:ios-native / desktop-smoke.
# The `cache` instruction fixes that. Under `cirrus run` (the CLI, not Cirrus
# Cloud) each cache blob is stored on the RUNNER ITSELF, in
# ~/Library/Caches/cirrus/projects/<project>/<key> (Go's os.UserCacheDir), so a
# single-machine runner needs no CIRRUS_HTTP_CACHE_HOST and no extra flag on
# the `cirrus run` lines in .gitlab-ci.yml. The blob is restored into the VM
# before the task's scripts run.
#
# Why a CONSTANT `fingerprint_key` rather than hashing Cargo.lock: the CLI's
# local blob store has NO eviction — nothing ever deletes an entry. A key
# derived from Cargo.lock would strand a multi-GB orphan on the mini's disk
# after every lockfile bump, and would hand a fully cold build to exactly the
# MRs that touch Cargo.lock. A constant key gives exactly ONE blob per entry,
# rewritten in place each run (`reupload_on_changes: true` — it defaults to
# false whenever a fingerprint is set, so it has to be explicit), and a hit on
# every run: cargo, not the cache key, decides what to recompile. Bump the
# trailing -vN of a key to force a cold rebuild and drop the old blob.
#
# Restoring `target/` reintroduces the mtime-skew hazard that
# scripts/ci-cargo-cache-freshness.mjs exists for (see its header, and
# .setup-rust in .gitlab-ci.yml): the cache lands AFTER the sources, so a
# restored rlib can carry an mtime newer than the source it was built from and
# cargo — which decides freshness by mtime, never by content — calls it fresh
# and skips the rebuild. Pipeline 33129 / job 211040 died that way on Linux.
# Every task below therefore runs that same shared guard before its first cargo
# invocation. CI_PROJECT_DIR has to be re-pointed for it: .cienv carries the
# GitLab runner's value, which is a host path that does not exist in the VM.
#
# Cache scope is per task family, keyed by which target/ subdirs the task fills
# (host debug vs. the three release-ffi iOS triples vs. universal-apple-darwin
# release). One shared blob would make every task upload the union of all of
# them.

test_rust_macos_task:
  name: testRustMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: this task fills target/debug (cargo test --workspace) and
    # target/aarch64-apple-ios/debug (the cargo check), which is a different set
    # from the release-ffi libs the iOS tasks build.
    folder: target
    fingerprint_key: futo-notes-target-test-rust-macos-$CIRRUS_OS-v1
    reupload_on_changes: true
  testRustMacOS_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate
    - pnpm install --frozen-lockfile
    - mkdir -p dist
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    # Whole workspace so the new core crates (model/index/sync) are covered on
    # macOS too; ignored server tests stay skipped (no FUTO_TEST_SERVER).
    # Main pushes and tags only: on MR pipelines the same command is already
    # the hard Linux gate (test:rust:workspace), and rerunning it here spent
    # ~6 min of the single macscript runner per Rust MR for an allow_failure
    # result. MRs keep only the iOS compile check below.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || { [ -n "${CI_DEFAULT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; }; then
        cargo test --workspace
      else
        echo "MR pipeline: skipping cargo test --workspace (hard-gated on Linux in test:rust:workspace); running the iOS target check only"
      fi
    # Mobile-target compile check: the full iOS app build only runs when the
    # shell or futo-notes-ffi itself changes, but every futo-notes crate is in
    # the FFI dependency tree. Type-check the tree for the device target so an
    # inner-crate iOS break surfaces on the MR instead of at tag time. The
    # Android sibling (which also links) is test:rust:ffi-android in GitLab.
    - rustup target add aarch64-apple-ios
    - cargo check -p futo-notes-ffi --target aarch64-apple-ios --locked
  # A cache's auto-generated upload inherits the cache instruction's ON_SUCCESS
  # behaviour, so a task that dies mid-compile (or hits the wall) uploads
  # nothing and dooms every retry to another cold start — the exact hazard
  # .gitlab-ci.yml's cache templates carry `when: always` for. Moving the
  # uploads into `always:` via `upload_caches` fixes that; cargo handles a
  # partial target/ fine. NOTE: naming ANY cache here disables the automatic
  # upload for ALL of them, so this list must stay exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target

test_desktop_smoke_macos_task:
  name: testDesktopSmokeMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: host debug build of the tauri crate (cargo tauri build
    # --debug), which no other task produces.
    folder: target
    fingerprint_key: futo-notes-target-desktop-smoke-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_tauri_cli_cache:
    # `cargo install tauri-cli` is a multi-minute compile all of its own that
    # the target/ cache above does NOT cover — cargo install builds in a
    # throwaway temp dir. So cache the installed binary instead, under a
    # working-dir root rather than $HOME/.cargo/bin, which the sh.rustup.rs
    # bootstrap rewrites on every run. Same trade .setup-rust already makes on
    # the Linux jobs (it caches .cargo-home/, bin included): once the binary is
    # cached its version is pinned, so bump -vN to pick up a newer tauri-cli.
    # Deliberately NOT applied to buildFutoNotesMacOS: that task is tag-only, so
    # no MR pipeline can exercise it, and a silently pinned tauri-cli there
    # would first show up in a release DMG.
    folder: .cirrus-cargo-bin
    fingerprint_key: futo-notes-cargo-tauri-cli-$CIRRUS_OS-v1
    reupload_on_changes: true
  testDesktopSmokeMacOS_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate
    - pnpm install --frozen-lockfile
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    - |
      TAURI_CLI_ROOT="$PWD/.cirrus-cargo-bin"
      if [ -x "$TAURI_CLI_ROOT/bin/cargo-tauri" ]; then
        echo "cargo-tauri restored from cache: $("$TAURI_CLI_ROOT/bin/cargo-tauri" --version)"
      else
        cargo install tauri-cli --locked --root "$TAURI_CLI_ROOT"
      fi
      export PATH="$TAURI_CLI_ROOT/bin:$PATH"
      command -v cargo-tauri
    # Build frontend + debug binary
    - pnpm run build
    - (cd apps/tauri && cargo tauri build --debug --no-bundle)
    # Pre-configure notes dir so app boots to editor
    - |
      NOTES_DIR=$(mktemp -d)
      mkdir -p "$HOME/Library/Application Support/com.futo.notes"
      echo '{"notesDir":"'"$NOTES_DIR"'"}' > "$HOME/Library/Application Support/com.futo.notes/notes-dir-override.json"
    # Launch (Cirrus macOS VMs have a display — no xvfb needed). Log +
    # screenshots land under the repo checkout (not /tmp) so the always:
    # artifacts block below can copy them out via --artifacts-dir.
    - mkdir -p test-screenshots
    - |
      target/debug/futo-notes-tauri > test-screenshots/tauri-smoke.log 2>&1 &
    # Run smoke tests (script handles port discovery from log)
    - node tests/desktop-smoke.mjs --log-file test-screenshots/tauri-smoke.log
    - kill $(pgrep -f futo-notes-tauri) 2>/dev/null || true
  always:
    # See the note on testRustMacOS's upload_caches: naming any cache disables
    # the automatic upload for all of them, so this list stays exhaustive.
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
      - cargo_tauri_cli
    desktop_smoke_artifacts:
      path: "test-screenshots/**"

test_ios_native_task:
  name: testFutoNotesIOSNative
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Shared with buildFutoNotesIOSNative on purpose: both run the identical
    # scripts/build-rust-ios.sh (three release-ffi iOS triples + the host debug
    # lib used for binding generation), so one blob serves both and the two
    # never run concurrently — the macscript runner drives one VM at a time.
    # The one input that differs is FUTO_HOSTED_SERVER_BAKED, which the
    # default-branch build sets. futo-notes-sync reads it via option_env!,
    # which cargo tracks in the fingerprint (not by mtime), so a flip rebuilds
    # only futo-notes-sync and its dependents, correctly, rather than serving a
    # stale baked address.
    folder: target
    fingerprint_key: futo-notes-target-ios-$CIRRUS_OS-v1
    reupload_on_changes: true
  testFutoNotesIOSNative_script:
    - brew install fnm xcodegen
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
    - pnpm install --frozen-lockfile
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    # Shared Rust FFI -> FutoNotesFfi.xcframework + Swift bindings.
    - bash scripts/build-rust-ios.sh
    # Embedded editor bundle used by the native bridge tests.
    - pnpm exec vite build --config vite.editor.config.ts
    - (cd apps/ios && xcodegen generate)
    # xcodebuild test requires one concrete simulator. Prefer an already-booted
    # iPhone; otherwise boot the first available iPhone runtime on the image.
    - |
      SIM=$(xcrun simctl list devices booted | sed -n 's/.*(\([0-9A-Fa-f-]\{36\}\)).*Booted.*/\1/p' | head -1)
      if [ -z "$SIM" ]; then
        SIM=$(xcrun simctl list devices available | sed -n '/iPhone/s/.*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | head -1)
        if [ -z "$SIM" ]; then
          echo "ERROR: no available iPhone simulator found" >&2
          xcrun simctl list devices available >&2
          exit 1
        fi
        xcrun simctl boot "$SIM"
      fi
      xcrun simctl bootstatus "$SIM" -b
      echo "Testing on simulator $SIM"
      export SIM
    # Two tiers, keyed the same way testRustMacOS keys its full run. MR
    # pipelines run only the FutoNotesNativeTests unit bundle (Swift Testing,
    # 323 tests in ~13s in job 264124); main pushes and tags also run the
    # FutoNotesNativeUITests bundle, 8 XCTest UI cases that took 173s of that
    # job's 226s test phase. A UI regression therefore surfaces on the main
    # push, before tag time, rather than on the MR.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] || { [ -n "${CI_DEFAULT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; }; then
        export IOS_TEST_TIER=full
      else
        export IOS_TEST_TIER=unit
      fi
      echo "iOS test tier: $IOS_TEST_TIER"
    # xcodebuild's EXIT CODE is unreliable for a Swift-Testing-only target: it
    # returns non-zero for the empty XCTest bundle's "Executed 0 tests" on some
    # Xcode versions even when Swift Testing passed and "** TEST SUCCEEDED **"
    # printed (reproduced on the shared Mac: Xcode 26.2 exits non-zero, 26.6
    # exits 0, byte-identical output). So do NOT gate on its exit here; capture
    # the log and let the outcome arbiter below decide (M11: assert outcomes,
    # not exit codes).
    - |
      set -o pipefail
      # `tee` cannot create the log if its dir is absent — and on a fresh CI
      # clone apps/ios/.build does not exist until xcodebuild's -derivedDataPath
      # makes it, by which point tee has already failed to open the file
      # (output still streams to the Cirrus log, so the file silently stays
      # empty). A warm local .build hid this. Create the dir first.
      mkdir -p apps/ios/.build
      ONLY_TESTING=()
      if [ "$IOS_TEST_TIER" = unit ]; then
        ONLY_TESTING=(-only-testing:FutoNotesNativeTests)
      fi
      set +e
      xcodebuild test -project apps/ios/FutoNotesNative.xcodeproj \
        -scheme FutoNotesNative \
        "${ONLY_TESTING[@]}" \
        -destination "id=$SIM" \
        -derivedDataPath apps/ios/.build \
        -resultBundlePath apps/ios/.build/TestResults.xcresult \
        CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" \
        2>&1 | tee apps/ios/.build/xcodebuild-test.log
      XCODEBUILD_EXIT=${PIPESTATUS[0]}
      set -e
      echo "xcodebuild-exit=$XCODEBUILD_EXIT (informational; the arbiter below decides)"
    # M11 outcome arbiter — pass/fail from what xcodebuild REPORTED, never its
    # exit code. Layered so it can never go silently green, and it checks each
    # bundle the tier ran by its own marker, so one bundle's tests can never
    # stand in for the other's.
    - |
      LOG=apps/ios/.build/xcodebuild-test.log
      # (1) Any genuine test/build failure marker -> red.
      if grep -Eq '\*\* TEST FAILED \*\*|Testing failed:|Failing tests:|Executed [0-9]+ tests?, with [1-9][0-9]* failures?|Test run with [0-9]+ tests?( in [0-9]+ suites?)? failed' "$LOG"; then
        echo "ERROR: xcodebuild reported test/build failures" >&2
        grep -Ei 'fail' "$LOG" | tail -20 >&2
        exit 1
      fi
      # (2) The unit bundle, in both tiers: Swift Testing's own summary with
      #     >=1 test. FutoNotesNativeTests is the only Swift Testing bundle
      #     (UITests is XCTest), so this line is its count and nothing else's.
      #     Its XCTest half always prints "Executed 0 tests" (it holds no
      #     XCTestCase), and that line must never satisfy anything here.
      UNIT_SUMMARY="$(awk '/Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed/ { line = $0 } END { print line }' "$LOG")"
      if [ -z "$UNIT_SUMMARY" ]; then
        echo "ERROR: no passing Swift Testing summary with >=1 test from FutoNotesNativeTests" >&2
        grep -E 'Executed [0-9]+ tests?|Test run with [0-9]+ tests?' "$LOG" >&2 || echo "(no test summary at all)" >&2
        exit 1
      fi
      echo "unit bundle: $UNIT_SUMMARY"
      # (3) The UI bundle, full tier only: its XCTest suite passed with >=1
      #     executed case. awk reads the whole log (no early-exit pipe, RC-65).
      if [ "$IOS_TEST_TIER" = full ]; then
        UI_EXECUTED="$(awk '/Test Suite .FutoNotesNativeUITests\.xctest. passed/ { getline; if (match($0, /Executed [0-9]+ test/)) { n = substr($0, RSTART + 9, RLENGTH - 14) } } END { print n + 0 }' "$LOG")"
        if [ "$UI_EXECUTED" -lt 1 ]; then
          echo "ERROR: full tier, but FutoNotesNativeUITests reported no passing suite with >=1 executed test" >&2
          exit 1
        fi
        echo "UI bundle: $UI_EXECUTED test(s) executed"
      fi
      # (4) Require the overall success marker.
      if ! grep -q '\*\* TEST SUCCEEDED \*\*' "$LOG"; then
        echo "ERROR: no '** TEST SUCCEEDED **' marker in the test log" >&2
        exit 1
      fi
      echo "iOS tests passed ($IOS_TEST_TIER tier; arbiter: TEST SUCCEEDED + per-bundle test counts + no failure markers)"
  always:
    # See the note on testRustMacOS's upload_caches: naming any cache disables
    # the automatic upload for all of them, so this list stays exhaustive.
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
    ios_test_results_artifacts:
      path: "apps/ios/.build/TestResults.xcresult/**"

publish_ios_task:
  name: publishFutoNotesIOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  publishFutoNotesIOS_script:
    # Fetch the ASC API key from GitLab secure files
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - mkdir -p ~/.private_keys
    - cp .secure_files/AuthKey*.p8 ~/.private_keys/

    # The IPA is already present: GitLab's `needs: build:ios-native` (default
    # `artifacts: true`) puts it in the publish:ios working dir at
    # buildFutoNotesIOSNative/binary/*.ipa, and Cirrus rsyncs the working dir
    # into this VM.
    - |
      IPA=""
      if [ -d buildFutoNotesIOSNative/binary ]; then
        IPA=$(find buildFutoNotesIOSNative/binary -name "*.ipa" -type f | head -1)
      fi
      if [ -z "$IPA" ]; then
        echo "ERROR: No IPA found in working dir — was build:ios-native artifact propagated?"
        exit 1
      fi
      echo "Uploading $IPA to TestFlight"
      xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

build_macos_task:
  name: buildFutoNotesMacOS
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob: target/universal-apple-darwin release artifacts, produced by
    # no other task. Tag-only job, so this entry is only refreshed at releases.
    folder: target
    fingerprint_key: futo-notes-target-macos-desktop-$CIRRUS_OS-v1
    reupload_on_changes: true
  buildFutoNotesMacOS_script:
    # Fetch secure files (certificates, API keys)
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash

    # Install signing certificate
    - security unlock-keychain -p "admin" ~/Library/Keychains/login.keychain
    - security import ./.secure_files/MacCertificates.p12 -k ~/Library/Keychains/login.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
    - "security set-key-partition-list -S apple-tool:,apple: -s -k admin ~/Library/Keychains/login.keychain"

    # Set Tauri signing env vars
    - export APPLE_CERTIFICATE=$(base64 < .secure_files/MacCertificates.p12)
    - export APPLE_CERTIFICATE_PASSWORD="$MACOS_CERT_PASSWORD"
    - export APPLE_SIGNING_IDENTITY="Developer ID Application: FUTO Holdings, Inc. (2W7AC6T8T5)"

    # Set Tauri notarization env vars. Tauri reads APPLE_API_KEY as the
    # key ID (NOT a path) and APPLE_API_KEY_PATH as the .p8 file path.
    # Getting these swapped silently disables notarization while codesign
    # still runs, producing signed-but-unnotarized DMGs that Gatekeeper
    # rejects with "Apple could not verify…".
    - export APPLE_API_KEY="$ASC_KEY_ID"
    # Absolute path: the script later cd's into apps/tauri before the build,
    # and notarytool resolves --key relative to cwd. A relative path here
    # silently breaks notarization with "file doesn't exist".
    - export APPLE_API_KEY_PATH="$(pwd)/$(ls .secure_files/AuthKey*.p8 | head -1)"
    - export APPLE_API_ISSUER="$ASC_ISSUER_ID"

    # Install Node + pnpm
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - node --version
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate

    # Install Rust. We ship a universal (x86_64 + arm64) DMG so a single
    # download runs native on both Apple Silicon and Intel Macs — both target
    # std libs are needed for `--target universal-apple-darwin`.
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    - cargo install tauri-cli --locked

    # Derive version from git tag
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Building macOS version $VERSION"

    # Install dependencies
    - pnpm install --frozen-lockfile

    # Set desktop/Tauri version sources from git tag.
    - node scripts/desktop-version.mjs "$VERSION"

    # Build universal macOS DMG + the updater bundle. The release overlay turns on
    # createUpdaterArtifacts, so Tauri (in this one build) codesigns + notarizes
    # the .app, then produces .app.tar.gz and minisigns it — correct ordering,
    # no separate re-sign needed. TAURI_SIGNING_PRIVATE_KEY arrives via .cienv;
    # the key has no password and --ci supplies the empty passphrase non-interactively.
    - test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
    # target/ is cached, so bundle/ still holds the previous run's output. DMG
    # names carry the version, so a stale one would ride along with the
    # `*.dmg` copy below into the release artifacts.
    - rm -rf target/universal-apple-darwin/release/bundle
    - cd apps/tauri
    - cargo tauri build --target universal-apple-darwin --config src-tauri/tauri.updater-release.conf.json --ci
    - cd ../..

    # Copy DMG (installer) + the updater artifact (.app.tar.gz + .sig) to the
    # artifact locations. macOS updater downloads the .app.tar.gz, NOT the .dmg.
    - cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ./
    - mkdir -p updater && cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz updater/ && cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig updater/
  # A cache's auto-generated upload inherits the cache instruction's ON_SUCCESS
  # behaviour, so a task that dies mid-compile (or hits the wall) uploads
  # nothing and dooms every retry to another cold start — the exact hazard
  # .gitlab-ci.yml's cache templates carry `when: always` for. Moving the
  # uploads into `always:` via `upload_caches` fixes that; cargo handles a
  # partial target/ fine. NOTE: naming ANY cache here disables the automatic
  # upload for ALL of them, so this list must stay exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
  binary_artifacts:
    path: "*.dmg"
  updater_artifacts:
    path: "updater/*"

# Internal, hosted-enabled macOS build (D2, taken —
# docs/plan/hosted-sync-to-staging.md, ticket C8). Invoked ONLY by
# .gitlab-ci.yml's build:desktop-internal:macos, on prerelease tags.
#
# Deliberately receives none of MACOS_CERT_PASSWORD/ASC_KEY_ID/ASC_ISSUER_ID/
# TAURI_SIGNING_PRIVATE_KEY — build:desktop-internal:macos exports only CI_*
# into .cienv, so no Apple certificate, no notarization credential, and no
# updater signing key ever reaches this VM. Building with the base
# tauri.conf.json (no --config override, unlike build_macos_task above) means
# there is no `createUpdaterArtifacts` and so no .sig/.app.tar.gz this job
# could produce even if it tried — the same M23 guarantee build_macos_task's
# updater-release config exists to prove, held here by simply never wiring
# the secrets or the config in. The DMG is unsigned; testers bypass
# Gatekeeper (right-click → Open, or `xattr -d com.apple.quarantine`).
build_macos_internal_task:
  name: buildFutoNotesMacOSInternal
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Own blob, NOT shared with buildFutoNotesMacOS despite the same target
    # triple: this build bakes VITE_HOSTED_SYNC / FUTO_HOSTED_SERVER_BAKED and
    # skips the release updater overlay, so one shared blob would flip-flop
    # between the two configurations on every alternating run.
    folder: target
    fingerprint_key: futo-notes-target-macos-internal-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_tauri_cli_cache:
    # Same key as testDesktopSmokeMacOS, so both run the one pinned tauri-cli
    # that desktop-smoke already exercises on every MR. Unlike
    # buildFutoNotesMacOS this is an unsigned internal build, not a release
    # DMG, so a pinned CLI here carries no release risk. See the note on
    # testDesktopSmokeMacOS's copy for why it lives outside $HOME/.cargo/bin.
    folder: .cirrus-cargo-bin
    fingerprint_key: futo-notes-cargo-tauri-cli-$CIRRUS_OS-v1
    reupload_on_changes: true
  buildFutoNotesMacOSInternal_script:
    - brew install fnm
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - node --version
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate

    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    - |
      TAURI_CLI_ROOT="$PWD/.cirrus-cargo-bin"
      if [ -x "$TAURI_CLI_ROOT/bin/cargo-tauri" ]; then
        echo "cargo-tauri restored from cache: $("$TAURI_CLI_ROOT/bin/cargo-tauri" --version)"
      else
        cargo install tauri-cli --locked --root "$TAURI_CLI_ROOT"
      fi
      export PATH="$TAURI_CLI_ROOT/bin:$PATH"
      command -v cargo-tauri

    # Tag builds derive the version from the tag; MR rehearsal builds have no
    # tag, so fall back to 0.0.0 (same fallback build:windows uses in
    # .gitlab-ci.yml) rather than passing desktop-version.mjs an empty string.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if [ -z "$VERSION" ]; then
        VERSION="0.0.0"
      fi
    - echo "Building internal macOS version $VERSION (hosted sync ON, staging server)"

    - pnpm install --frozen-lockfile
    - node scripts/desktop-version.mjs "$VERSION"

    - export VITE_HOSTED_SYNC=true
    - export FUTO_HOSTED_SERVER_BAKED=https://staging-notes-sync.futo.org
    - unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD

    # Same as buildFutoNotesMacOS: clear the cached bundle/ so a previous
    # run's versioned DMG cannot ride along with the `*.dmg` copy below.
    - rm -rf target/universal-apple-darwin/release/bundle
    - cd apps/tauri
    - cargo tauri build --target universal-apple-darwin
    - cd ../..

    - cp target/universal-apple-darwin/release/bundle/dmg/*.dmg ./
  # See the note on testRustMacOS's upload_caches: naming any cache disables
  # the automatic upload for all of them, so this list stays exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
      - cargo_tauri_cli
  binary_artifacts:
    path: "*.dmg"

# Native iOS app (SwiftUI over the futo-notes-ffi UniFFI core + embedded
# editor.html). Tag builds produce a signed Release IPA for TestFlight;
# non-tag builds are unsigned simulator compile checks.
build_ios_native_task:
  name: buildFutoNotesIOSNative
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sequoia-xcode:26.2
  env:
    # Incremental artifacts are per-machine scratch that a fresh VM can never
    # reuse, and they are ~0.6 GB of pure churn in every target/ cache upload.
    CARGO_INCREMENTAL: "0"
  cargo_registry_cache:
    folder: $HOME/.cargo/registry
    fingerprint_key: futo-notes-cargo-registry-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_git_cache:
    # Empty today (Cargo.lock has no git dependencies) — the agent then just
    # logs "All cache folders are empty! Skipping uploading". Declared anyway so
    # a future git dependency does not silently re-clone in every task.
    folder: $HOME/.cargo/git
    fingerprint_key: futo-notes-cargo-git-$CIRRUS_OS-v1
    reupload_on_changes: true
  cargo_target_cache:
    # Same blob as testFutoNotesIOSNative — identical build-rust-ios.sh
    # output. See that task for the reasoning.
    folder: target
    fingerprint_key: futo-notes-target-ios-$CIRRUS_OS-v1
    reupload_on_changes: true
  build_ios_native_script:
    - brew install fnm xcodegen
    - eval "$(fnm env --shell bash)"
    - fnm use --install-if-missing
    - corepack enable
    - corepack prepare pnpm@10.29.2 --activate
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
    - pnpm install --frozen-lockfile
    # Hosted sync is on for the internal dogfood build (default branch →
    # TestFlight) and off for tag/MR builds, per ADR 0003 decision 13 (the
    # archive step below re-derives the same condition for
    # HOSTED_SYNC_CONDITION). Determined here, before the Rust FFI build, so
    # the dogfood build's xcframework also bakes the staging hosted address
    # rather than the production one (C3, ADR 0003 decision 2).
    - |
      if [ -z "${CI_COMMIT_TAG:-}" ] && [ -n "${CI_DEFAULT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
        export FUTO_HOSTED_SERVER_BAKED=https://staging-notes-sync.futo.org
        echo "Default-branch build — internal dogfood, baked hosted server: $FUTO_HOSTED_SERVER_BAKED"
      fi
    # Two different mtime lies have to be undone before cargo looks at the
    # restored caches — see each script's header.
    # (1) Cirrus untars without applying the tar header's mtime, so a restored
    #     tree comes back in walk order and cargo rebuilds every build-script
    #     crate and proc-macro on a full cache hit. Arguments are oldest-first.
    - node scripts/ci-cirrus-cache-mtimes.mjs "$HOME/.cargo/registry" target
    # (2) The cache lands after the sources, so a restored artifact can still
    #     claim to be newer than the source it was built from.
    - CI_PROJECT_DIR="${CIRRUS_WORKING_DIR:-$PWD}" node scripts/ci-cargo-cache-freshness.mjs
    # Shared Rust FFI -> FutoNotesFfi.xcframework + Swift bindings (uses
    # xcodebuild -create-xcframework).
    - bash scripts/build-rust-ios.sh
    # Embedded editor bundle (single self-contained editor.html).
    - pnpm exec vite build --config vite.editor.config.ts
    # Generate the Xcode project.
    - (cd apps/ios && xcodegen generate)
    - |
      # Sign + archive on tag builds (release IPA) AND default-branch builds
      # (the dogfood IPA that publish:ios:main ships to TestFlight). MRs fall
      # through to the unsigned simulator compile check below.
      if [ -n "${CI_COMMIT_TAG:-}" ] || { [ -n "${CI_DEFAULT_BRANCH:-}" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; }; then
        echo "Building signed native iOS release for ${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}"
        curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash

        security unlock-keychain -p "admin" ~/Library/Keychains/login.keychain
        security import ./.secure_files/Certificates.p12 -k ~/Library/Keychains/login.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k admin ~/Library/Keychains/login.keychain

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        PROFILE_NAME=""
        for PROFILE_PATH in .secure_files/*.mobileprovision; do
          [ -e "$PROFILE_PATH" ] || continue
          PROFILE_PLIST=$(mktemp)
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$PROFILE_PLIST" 2>/dev/null || true)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          if [[ "$APP_ID" == *.com.futo.notes ]]; then
            PROFILE_NAME="$NAME"
          fi
          rm -f "$PROFILE_PLIST"
        done
        if [ -z "$PROFILE_NAME" ]; then
          echo "ERROR: No provisioning profile found for com.futo.notes"
          exit 1
        fi

        # Tag builds use the tag version; default-branch builds use the latest
        # release patch-bumped (see scripts/ios-marketing-version.mjs). The build
        # number is the pipeline IID — monotonic across the whole project, so a
        # main build never collides with or regresses below a tag build's number.
        VERSION="$(node scripts/ios-marketing-version.mjs)"
        BUILD_NUMBER="${CI_PIPELINE_IID:-1}"
        echo "Marketing version $VERSION (build $BUILD_NUMBER)"
        # Hosted sync is on for the internal dogfood build (default branch →
        # TestFlight) and off for the store release (tag), per ADR 0003
        # decision 13. project.yml's Release config expands this setting into
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS; empty compiles none of it in.
        HOSTED_SYNC_CONDITION=""
        if [ -z "${CI_COMMIT_TAG:-}" ]; then
          HOSTED_SYNC_CONDITION="FUTO_HOSTED_SYNC"
        fi
        echo "Hosted sync condition: '${HOSTED_SYNC_CONDITION:-<off>}'"
        ARCHIVE="apps/ios/.build-release/FutoNotesNative.xcarchive"
        xcodebuild -project apps/ios/FutoNotesNative.xcodeproj \
          -scheme FutoNotesNative -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath apps/ios/.build-release \
          -archivePath "$ARCHIVE" \
          DEVELOPMENT_TEAM=2W7AC6T8T5 \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
          MARKETING_VERSION="$VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          FUTO_HOSTED_SYNC_CONDITION="$HOSTED_SYNC_CONDITION" \
          archive | tail -5

        cat > /tmp/ExportOptionsNative.plist << PLISTEOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
          <key>method</key>
          <string>app-store</string>
          <key>teamID</key>
          <string>2W7AC6T8T5</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>provisioningProfiles</key>
          <dict>
              <key>com.futo.notes</key>
              <string>${PROFILE_NAME}</string>
          </dict>
      </dict>
      </plist>
      PLISTEOF
        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE" \
          -exportOptionsPlist /tmp/ExportOptionsNative.plist \
          -exportPath apps/ios/.build-release/export

        IPA_PATH=$(find apps/ios/.build-release/export -name "*.ipa" -type f | head -1)
        if [ -z "$IPA_PATH" ]; then
          echo "ERROR: native iOS export produced no IPA"
          exit 1
        fi
        cp "$IPA_PATH" ./
        # Keep the dSYMs: the crash reporter writes `<image> <offset>` frames,
        # which only these symbolicate (the release job stores them per tag).
        if ! ls "$ARCHIVE"/dSYMs/*.dSYM >/dev/null 2>&1; then
          echo "ERROR: native iOS archive produced no dSYMs"
          exit 1
        fi
        ditto -c -k --keepParent "$ARCHIVE/dSYMs" FutoNotesNative-dSYMs.zip
      else
        # Simulator compile check (unsigned). ARCHS=arm64: the FFI xcframework
        # only ships an arm64 simulator slice (aarch64-apple-ios-sim); a bare
        # 'generic/platform=iOS Simulator' build also targets x86_64 and fails
        # to link. Build-only, so host arch is moot.
        xcodebuild -project apps/ios/FutoNotesNative.xcodeproj \
          -scheme FutoNotesNative -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath apps/ios/.build \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
          build | tail -5
      fi
  # A cache's auto-generated upload inherits the cache instruction's ON_SUCCESS
  # behaviour, so a task that dies mid-compile (or hits the wall) uploads
  # nothing and dooms every retry to another cold start — the exact hazard
  # .gitlab-ci.yml's cache templates carry `when: always` for. Moving the
  # uploads into `always:` via `upload_caches` fixes that; cargo handles a
  # partial target/ fine. NOTE: naming ANY cache here disables the automatic
  # upload for ALL of them, so this list must stay exhaustive.
  always:
    upload_caches:
      - cargo_registry
      - cargo_git
      - cargo_target
  binary_artifacts:
    path: "*.ipa"
  dsyms_artifacts:
    path: "*-dSYMs.zip"
