packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: true

onlyBuiltDependencies:
  - esbuild
  - protobufjs

overrides:
  'devalue@<5.8.1': 5.8.1
  'picomatch@4': 4.0.4
  'esbuild@<0.28.1': 0.28.1
  'postcss@<8.5.23': 8.5.23
  'nanoid@<3.3.18': 3.3.18
  'yaml@<2.8.3': 2.8.3

# Advisories `pnpm audit --prod` should not fail on. Empty on purpose — see .cargo/audit.toml
# for the policy. Add the id with a comment saying why; `just audit --fix` removes entries
# whose advisory is gone.
auditConfig:
  ignoreGhsas: []
