packages:
  - apps/*
  - packages/*

# Advisories `pnpm audit --prod` should not fail on. Empty on purpose — see .cargo/audit.toml
# for the policy. Add the id with a comment saying why; `node scripts/audit.mjs --fix` removes
# entries whose advisory is gone.
auditConfig:
  ignoreGhsas: []

onlyBuiltDependencies:
  - esbuild
  - protobufjs

overrides:
  devalue@<5.8.1: 5.8.1
  esbuild@<0.28.1: 0.28.1
  nanoid@<3.3.18: 3.3.18
  picomatch@4: 4.0.4
  postcss@<8.5.23: 8.5.23
  yaml@<2.8.3: 2.8.3

patchedDependencies:
  micromark@4.0.2: patches/micromark@4.0.2.patch
  prosemirror-view@1.42.3: patches/prosemirror-view@1.42.3.patch

shamefullyHoist: true
