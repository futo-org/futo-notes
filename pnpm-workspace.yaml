packages:
  - apps/*
  - packages/*

# Advisories `pnpm audit --prod` should not fail on — see .cargo/audit.toml for the policy. Add the id with a comment saying why; `node scripts/audit.mjs --fix` removes
# entries whose advisory is gone.
auditConfig:
  ignoreGhsas:

allowBuilds:
  esbuild: true

overrides:
  devalue@<5.8.1: 5.9.4
  esbuild@<0.28.1: 0.28.2
  nanoid@<3.3.18: 3.3.20
  picomatch@4: 4.0.7
  postcss@<8.5.23: 8.5.32
  source-map-js@<1.2.2: 1.2.2

shamefullyHoist: true
