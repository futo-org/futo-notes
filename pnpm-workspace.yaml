packages:
  - apps/*
  - packages/*

# Advisories `pnpm audit --prod` should not fail on. Empty on purpose — see .cargo/audit.toml
# for the policy. Add the id with a comment saying why; `node scripts/audit.mjs --fix` removes
# entries whose advisory is gone.
auditConfig:
  ignoreGhsas: []

onlyBuiltDependencies:
  - esbuild

overrides:
  devalue@<5.8.1: 5.8.1
  dompurify@<3.4.17: 3.4.17
  esbuild@<0.28.1: 0.28.1
  nanoid@<3.3.18: 3.3.18
  picomatch@4: 4.0.4
  postcss@<8.5.23: 8.5.23
  source-map-js@<1.2.2: 1.2.2

patchedDependencies:
  micromark@4.0.3: patches/micromark@4.0.3.patch
  prosemirror-view@1.42.7: patches/prosemirror-view@1.42.7.patch

shamefullyHoist: true
