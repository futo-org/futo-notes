- name: ul-basic
  complexity: 10
  markdown: |
    - First item
    - Second item
    - Third item
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
        count: 3
    widgets:
      - class: cm-md-bullet
        count: 3

- name: ul-nested
  complexity: 30
  markdown: |
    - Outer item
      - Nested item
        - Deep nested
  cursor: null
  expect:
    widgets:
      - class: cm-md-bullet
        count: 3

# `*  Parent.` (two spaces after the marker) puts its content at column 3, so a
# two-space child is not deep enough to nest and CommonMark demotes it to an
# outer-list sibling. lezer then spans that ListItem from the line start rather
# than the marker, which used to drop every decoration for the line: the raw `*`
# stayed on screen with no bullet.
- name: ul-sibling-indented-below-parent-content-column
  complexity: 35
  markdown: |
    *  Parent.
      * child
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
        count: 2
    widgets:
      - class: cm-md-bullet
        count: 2
    visible_text_excludes: "*"

- name: ul-whole-list-indented-one-space
  complexity: 35
  markdown: |
     * alpha
     * beta
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
        count: 2
    widgets:
      - class: cm-md-bullet
        count: 2
    visible_text_excludes: "*"

- name: ul-with-emphasis
  complexity: 60
  markdown: "- Item with **bold** text"
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
      - class: cm-md-strong
        text: "bold"

- name: ul-with-inline-code
  complexity: 60
  markdown: "- Item with `code` text"
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
      - class: cm-md-code

- name: ul-with-wikilink
  complexity: 65
  markdown: "- Check [[my note]]"
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
      - class: cm-md-wikilink
        text: "my note"

- name: ul-with-tag
  complexity: 65
  markdown: "- Important item #todo"
  cursor: null
  expect:
    decorations:
      - class: cm-md-ul-item
      - class: cm-md-tag
    tags:
      - "#todo"
