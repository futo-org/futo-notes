# pulldown-cmark 0.13.6 with one local change (see PATCH.md). Not a workspace
# member: the workspace `[patch.crates-io]` points the editor at this copy.
[package]
edition = "2021"
rust-version = "1.71.1"
name = "pulldown-cmark"
version = "0.13.6"
description = "A pull parser for CommonMark"
license = "MIT"
repository = "https://github.com/raphlinus/pulldown-cmark"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
default = ["html"]
html = ["pulldown-cmark-escape"]
simd = ["pulldown-cmark-escape?/simd"]

[lib]
name = "pulldown_cmark"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
memchr = "2.5"
pulldown-cmark-escape = { version = "0.11", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
unicase = "2.6"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(rustbuild)"]
