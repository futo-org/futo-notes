[package]
name = "futo-notes-sync"
version = "0.1.0"
edition = "2021"

[lib]
name = "futo_notes_sync"

[dependencies]
futo-notes-core = { path = "../futo-notes-core" }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2.5"
time = { version = "0.3", features = ["parsing"] }
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "io-util", "net"] }
wiremock = "0.6"
# The hosted scenarios stand in for a platform auth sheet with a browser-shaped
# client: the login chain hands back an `oidc_flow` cookie at the callback, so a
# jar is the difference between signing in and `missing oidc flow cookie`.
# Dev-only under resolver 2, so the shipped client keeps its current features.
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
# The hosted stub mints pairing expiries the way the relay does, which means
# writing RFC 3339. The client only ever parses one, so `formatting` stays
# dev-only for the same reason the cookie jar does.
time = { version = "0.3", features = ["formatting"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
openssl-probe = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies.futo-notes-core]
path = "../futo-notes-core"
features = ["test-support"]
