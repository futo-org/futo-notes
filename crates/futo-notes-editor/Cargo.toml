[package]
name = "futo-notes-editor"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
futo-notes-wikilinks = { path = "../futo-notes-wikilinks" }
futo-notes-tags = { path = "../futo-notes-tags" }
ropey = "1.6"
web-time = "1"
similar = { version = "3.2", default-features = false, features = ["text"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1.13"
serde = { version = "1", features = ["derive"] }
markdown = { version = "1.0.0", default-features = false }
unicase = { version = "2.10.0", default-features = false }

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
