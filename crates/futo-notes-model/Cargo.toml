[package]
name = "futo-notes-model"
version = "0.1.0"
edition = "2021"

[lib]
name = "futo_notes_model"

# Pure note-domain decisions shared by the durable store and every shell.
[dependencies]
futo-notes-wikilinks = { path = "../futo-notes-wikilinks" }
futo-notes-tags = { path = "../futo-notes-tags" }
futo-notes-core = { path = "../futo-notes-core" }
memchr = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
