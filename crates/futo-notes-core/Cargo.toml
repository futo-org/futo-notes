[package]
name = "futo-notes-core"
version = "0.1.0"
edition = "2021"

[features]
test-support = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# The instance journal writes JSONL; every other crate already carries this.
serde_json = "1"
filetime = "0.2"
diffy = "0.4"
rand = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
# Argon2id wraps the hosted vault key (ADR 0003); PBKDF2 stays for v1 envelopes.
# default-features = false drops the PHC-string/`rand` layers we never use — the
# raw `hash_password_into` KDF is all the envelope needs.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = "0.12"
# HKDF-SHA256 derives the recovery-envelope wrap key and the sealed-box key.
hkdf = "0.12"
# X25519 for QR pairing: the unlocked device seals the vault key to the new
# device's one-time public key. `static_secrets` exposes StaticSecret, which is
# what lets the new device keep its secret between showing the code and polling.
x25519-dalek = { version = "2", default-features = false, features = [
  "static_secrets",
  "precomputed-tables",
  "zeroize",
] }
hex = "0.4"
thiserror = "1"
time = "0.3"
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# default-features = false drops proptest's `fork`/`timeout` features, whose
# `rusty-fork` + `tempfile` dependencies would pull the `tempfile` crate into
# the workspace lockfile — this repo's tests hand-roll tempdirs instead
# (crates/futo-notes-core/AGENTS.md). `bit-set` is kept because the
# `sample::subsequence`/`Index` strategies need it.
proptest = { version = "1.11.0", default-features = false, features = [
  "std",
  "bit-set",
] }
