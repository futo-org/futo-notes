<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FUTO coin tuner</title>
    <!--
      A dev tool, not a product surface: it is served only by
      `just coin-tuner` (scripts/coin-tuner.mjs), never bundled into the app,
      and so it deliberately uses plain DOM and no build step. three.js comes
      straight out of node_modules through the import map below, which is why
      the version here is exactly the version the desktop shell renders with.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/": "/node_modules/three/"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --ink: #fafafa;
        --dim: #a3a3a3;
        --line: #2a2a2a;
        --panel: #131313;
        --accent: #ffbb00;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        display: grid;
        grid-template-columns: minmax(320px, 380px) 1fr;
        height: 100vh;
        background: #0a0a0a;
        color: var(--ink);
        font-size: 13px;
      }

      /* ── The controls ─────────────────────────────────────────────── */

      #controls {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 14px 16px 60px;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        letter-spacing: 0.02em;
      }

      .lede {
        margin: 0 0 16px;
        color: var(--dim);
        font-size: 11.5px;
        line-height: 1.45;
      }

      .group {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .group > summary {
        cursor: pointer;
        padding: 8px 10px;
        background: #191919;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--dim);
        user-select: none;
      }

      .group[open] > summary {
        border-bottom: 1px solid var(--line);
        color: var(--ink);
      }

      .group-body {
        padding: 10px;
      }

      .note {
        margin: 0 0 10px;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.5;
      }

      .control {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        align-items: center;
        margin-bottom: 9px;
      }

      .control > label {
        font-size: 12px;
      }

      .control > .value {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--accent);
        text-align: right;
        min-width: 58px;
      }

      .control > input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
      }

      .control.inline {
        grid-template-columns: 1fr auto;
      }

      .control.inline > input {
        grid-column: auto;
      }

      input[type='color'] {
        width: 46px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--line);
        background: none;
      }

      select,
      button {
        font-family: inherit;
        font-size: 12px;
        color: var(--ink);
        background: #1f1f1f;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .lamp-note {
        color: var(--dim);
        font-size: 10.5px;
        line-height: 1.45;
        margin: 0 0 8px;
      }

      .triple {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 9px;
      }

      .triple input {
        width: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--ink);
        background: #1f1f1f;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 5px;
      }

      .triple span {
        color: var(--dim);
        font-size: 10px;
      }

      /* ── The stage ────────────────────────────────────────────────── */

      #stage {
        display: grid;
        grid-template-rows: 1fr auto;
        min-width: 0;
      }

      #backdrop {
        display: grid;
        place-items: center;
        background: #171717;
      }

      #mount {
        width: 160px;
        height: 160px;
        touch-action: none;
        cursor: grab;
      }

      #mount[data-turning='true'] {
        cursor: grabbing;
      }

      #readouts {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 10px 14px;
        display: flex;
        gap: 22px;
        flex-wrap: wrap;
        align-items: center;
      }

      .readout {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .readout b {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15px;
        font-weight: 600;
      }

      .readout span {
        color: var(--dim);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .readout.hot b {
        color: #ef4444;
      }

      #output {
        position: relative;
        border-top: 1px solid var(--line);
        background: #0d0d0d;
        max-height: 34vh;
        overflow: auto;
      }

      #output pre {
        margin: 0;
        padding: 12px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.55;
        color: #d4d4d4;
        white-space: pre;
      }

      #failure {
        display: none;
        margin: 0;
        padding: 10px 14px;
        background: #3f1010;
        color: #fecaca;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <h1>FUTO coin tuner</h1>
      <p class="lede">
        The real <code>futo-coin.glb</code>, lit by the studio from
        <code>build-coin.py</code> rebuilt live. Nothing here writes to the repo — when a setting is
        right, paste the numbers it prints back into the files it names.
      </p>
      <div id="panels"></div>
    </div>

    <div id="stage">
      <div id="backdrop"><div id="mount"></div></div>
      <div id="readouts"></div>
      <div id="output"><pre id="snippet">loading…</pre></div>
      <p id="failure"></p>
    </div>

    <script type="module" src="/scripts/coin-tuner/tuner.js"></script>
  </body>
</html>
